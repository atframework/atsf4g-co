# Default values for lobby.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

proc_name: dtcoordsvrd

type_id: 13
type_name: "dtcoordsvr"

image:
  repository: harbor.atframe.work/atsf4g-co/dtcoordsvr
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest
  secrets: harbor-regcred

volumeMounts:
  configMountPath: /etc/atframework/publish/dtcoordsvr/cfg
  logMountPath: /data/atframework/publish/dtcoordsvr/log

vector:
  enabled: false
  log_path: /data/atframework/publish/dtcoordsvr/log

redis:
  enable: true

dtcoordsvr:
  lru_expired_duration: 1800s # 30min for lru cache expired
  lru_max_cache_count: 30000 # max count of transaction cache
  transaction_default_timeout: 10s
  transaction_expire_grace_duration: 5s # grace window after expire before coordinator auto-reject; DB TTL uses the same base
  transaction_max_ttl: 30d # hard cap of transaction DB TTL window (expire + grace), no recovery-budget stacking
