# Default values for lobby.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

proc_name: dtcoordsvrd

type_id: 13
type_name: "dtcoordsvr"

image:
  repository: harbor.atframe.work/atsf4g-co/server
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

volumeMounts:
  configMountPath: /data/atframework/publish/dtcoordsvr/cfg
  logMountPath: /data/atframework/publish/dtcoordsvr/log

vector:
  enabled: true
  log_path: /data/atframework/publish/dtcoordsvr/log

redis:
  enable: true

dtcoordsvr:
  lru_expired_duration: 1800s # 30min for lru cache expired
  lru_max_cache_count: 30000 # max count of transaction cache
  transaction_default_timeout: 10s
