# Default values for lobby.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

proc_name: dtmq-metasvrd

type_id: 21
type_name: "dtmq-metasvr"

image:
  repository: harbor.m-oa.com:6023/project-x/dtmq-metasvr
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest
  secrets: harbor-regcred

volumeMounts:
  configMountPath: /etc/atframework/publish/dtmq-metasvr/cfg
  logMountPath: /data/atframework/publish/dtmq-metasvr/log

vector:
  enabled: false
  log_path: /data/atframework/publish/dtmq-metasvr/log

redis:
  enable: true
