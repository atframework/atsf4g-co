# Default values for lobby.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

proc_name: orbit-agentd

type_id: 26
type_name: "orbit-agent"

image:
  repository: harbor.m-oa.com:6023/project-x/orbit-agent
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest
  secrets: harbor-regcred

volumeMounts:
  configMountPath: /etc/atframework/publish/orbit-agent/cfg
  logMountPath: /data/atframework/publish/orbit-agent/log

vector:
  enabled: false
  log_path: /data/atframework/publish/orbit-agent/log

orbit_agent:
  region: default
  tag: ""
  configured_client_command_line: ..\..\orbit-auto-client\bin\orbit-auto-client.exe
  cpu_capacity: 1
  memory_capacity_mb: 1024
  server_identity_timeout_sec: 30
  server_identity_check_interval_sec: 5
  max_batch_startup_count: 3

  enable_seed_mode: false
  seed_startup_timeout_sec: 30
  seed_heartbeat_timeout_sec: 10
  seed_client_command_line: ..\..\orbit-auto-client\bin\orbit-auto-client.exe

etcd:
  cluster_name: atsf4g-co-orbit-agent
  watcher:
    enabled: false
  keepalive:
    enabled: true

external_discovery:
  - enabled: true
    cluster_name: atsf4g-co-orbit-controller
    watcher:
      enabled: true
    keepalive:
      enabled: false