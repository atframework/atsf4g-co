# Default values for lobby.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

proc_name: orbit-agentd

type_id: 26
type_name: "orbit-agent"

image:
  repository: harbor.atframe.work/atsf4g-co/orbit-agent
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest
  secrets: harbor-regcred

volumeMounts:
  configMountPath: /etc/atframework/publish/orbit-agent/cfg
  logMountPath: /data/atframework/publish/orbit-agent/log

vector:
  enabled: false
  log_path: /data/atframework/publish/orbit-agent/log

# 禁用扩缩容线程 大于 max_batch_startup_count
atapp:
  worker_pool:
    worker_number_min: 4
    worker_number_max: 4


etcd:
  cluster_name: atsf4g-co-orbit-agent
  watcher:
    enabled: false
  keepalive:
    enabled: true

external_discovery:
  - enabled: true
    cluster_name: atsf4g-co-orbit-controller
    watcher:
      enabled: true
    keepalive:
      enabled: false
