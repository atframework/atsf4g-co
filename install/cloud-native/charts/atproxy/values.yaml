# Default values for lobby.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

proc_name: atproxyd

type_id: 1
type_name: "atproxy"

image:
  repository: harbor.m-oa.com:6023/project-x/atproxy
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest
  secrets: harbor-regcred

volumeMounts:
  configMountPath: /etc/atframework/publish/atproxy/cfg
  logMountPath: /data/atframework/publish/atproxy/log

vector:
  enabled: false
  log_path: /data/atframework/publish/atproxy/log


service:
  type: ClusterIP
  port: 7101
  targetPort: 7101
  protocol: TCP

redis:
  enable: true

atproxy:
  activity_connecttion:
    enabled: true
    # metadata:
    #   api_version: v1
    #   kind: Atframework/Atproxy
    #   group: atframework
    #   name: atproxy
    #   namespace_name: default
    #   uid: 1000
    #   service_subset: default
    #   labels:
    #     "service.name": "atproxy"
    retry_interval_min: 8s
    retry_interval_max: 300s

service:
  type: ClusterIP
  port: 7101
  targetPort: 7101
  protocol: TCP
