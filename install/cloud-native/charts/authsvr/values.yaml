# Default values for lobby.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

proc_name: authsvrd

type_id: 11
type_name: "authsvr"

image:
  repository: harbor.atframe.work/atsf4g-co/server
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

volumeMounts:
  configMountPath: /data/atframework/publish/authsvr/cfg
  logMountPath: /data/atframework/publish/authsvr/log

vector:
  log_path: /data/atframework/publish/authsvr/log
  image:
    repository: harbor.atframe.work/vector/vector:latest
    pullPolicy: Always
  sliks:
    console:
      enable: false
    test_file:
      enable: false
    opensearch:
      enable: true
      username: project-Y-log-writer
      password: 11bo1B{OE,gjzZ4D
      endpoint: https://opensearch-cluster-master.devops.svc.cluster.local:9200/
  index:
    - "user_id"
    - "task_name"
    - "zone_id"
    - "response_code"

imagePullSecrets:
  - name: harbor-regcred

persistence:
  cbs:
    enabled: true
    storageClass: openebs-hostpath
    volumes:
      - name: log
        storage: 5Gi
        accessMode: ReadWriteOnce

redis:
  enable: true

authsvr:
  version_conf: ../cfg/cfg_version.xml # version file
  strategy_conf: ../cfg/cfg_strategy.loginsvr.xml # strategy file
  # cdn_url:                                         # cdn url
  # debug_platform: 0                                # debug platform mode
  start_time: 0 # service start time
  end_time: 0 # service end time
  # white_openid_list:                               # white openid list, can ignore start time and end time
  backend:
    router:
      type_id: 12
      type_name: lobbysvr
      policy: hash # random/round_robin/hash
      # policy_selector:
      #   api_version: apps/v1
      #   kind: StatefulSet
      #   name: authsvr
      #   namespace_name: hello
      #   service_subset: ""
      #   labels:
      #     district: cn
    relogin_expire: 14400
