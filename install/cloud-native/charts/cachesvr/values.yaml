# Default values for lobby.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

proc_name: cachesvrd

type_id: 15
type_name: "cachesvr"

image:
  repository: harbor.atframe.work/atsf4g-co/server
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

volumeMounts:
  configMountPath: /data/atframework/publish/cachesvr/cfg
  logMountPath: /data/atframework/publish/cachesvr/log

vector:
  enabled: true
  log_path: /data/atframework/publish/cachesvr/log

redis:
  enable: true
