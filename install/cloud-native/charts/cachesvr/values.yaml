# Default values for lobby.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

proc_name: cachesvrd

type_id: 15
type_name: "cachesvr"

image:
  repository: harbor.m-oa.com:6023/project-x/cachesvr
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest
  secrets: harbor-regcred

volumeMounts:
  configMountPath: /etc/atframework/publish/cachesvr/cfg
  logMountPath: /data/atframework/publish/cachesvr/log

vector:
  enabled: false
  log_path: /data/atframework/publish/cachesvr/log

redis:
  enable: true
