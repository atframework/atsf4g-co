{{- define "libapp.httproute.tpl" -}}
{{- $httproute := default (dict) .Values.httproute -}}
{{- if $httproute }}
{{- $atapp := default (dict) .Values.atapp -}}
{{- $deploy := default (dict) $atapp.deployment -}}
{{- $env := default "" $deploy.deployment_environment -}}
{{- $ws := default (dict) .Values.websocket -}}
{{- $wspath := default "" $ws.path -}}
{{- $service := default (dict) .Values.service -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # name: 使用 chart fullname 并追加 -http-route，允许通过 .Values.httproute.name 覆盖
  name: {{ default (printf "%s-http-route" (include "libapp.fullname" .)) $httproute.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "libapp.name" . }}
    release: {{ .Release.Name }}
spec:
  parentRefs:
  - name: {{ default "project-x-tls-gateway" $httproute.parentRefsName | quote }}
  # hostnames: 支持单个字符串或数组 .Values.httproute.hosts
  rules:
  - matches:
    - path:
        type: PathPrefix
        {{- if $wspath }}
        value: {{ printf "/%s/%s/ws/v1" $env $wspath | replace "///" "/" | replace "//" "/" | quote }}
        {{- else }}
        value: "/ws/v1"
        {{- end }}
    backendRefs:
    - name: {{ include "libapp.fullname" . }}
      port: {{ default 80 $service.port }}
{{- end -}}
{{- end -}}
{{- define "libapp.httproute" -}}
{{- template "libapp.util.merge" (append . "libapp.httproute.tpl") -}}
{{- end -}}