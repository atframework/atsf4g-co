# Default values for lobby.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

proc_name: atgateway

type_id: 2
type_name: "atgateway"

image:
  repository: harbor.atframe.work/atsf4g-co/server
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

volumeMounts:
  configMountPath: /data/atframework/publish/atgateway/cfg
  logMountPath: /data/atframework/publish/atgateway/log

vector:
  enabled: true
  log_path: /data/atframework/publish/atgateway/log
