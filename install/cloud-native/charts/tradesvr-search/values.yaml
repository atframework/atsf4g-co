# Default values for tradesvr-search.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

proc_name: tradesvr-searchd

type_id: 54
type_name: "tradesvr-search"
replicaCount: 1

image:
  repository: harbor.atframe.work/atsf4g-co/tradesvr-search
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest
  secrets: harbor-regcred

volumeMounts:
  configMountPath: /etc/atframework/publish/tradesvr-search/cfg
  logMountPath: /data/atframework/publish/tradesvr-search/log

vector:
  enabled: false
  log_path: /data/atframework/publish/tradesvr-search/log

redis:
  enabled: true

enable_excel_config: true

trade:
  enabled: true
