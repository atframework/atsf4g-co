
atgateway:
  crypto:
    compression_algorithms:
      - "zstd"
      - "lz4"
      - "snappy"
      - "zlib"
    algorithms:
      - "xxtea"
      - "aes-128-cbc"
      - "aes-192-cbc"
      - "aes-256-cbc"
      - "aes-128-gcm"
      - "aes-192-gcm"
      - "aes-256-gcm"
      - "chacha20"
      - "chacha20-poly1305"
      - "xchacha20-poly1305"
    kdf_algorithms:
      - "hkdf-sha256"
    key_exchange: x25519
    access_tokens:
      - "atgateway-access-token"
    update_interval: 300s