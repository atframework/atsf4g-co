atgateway:
  default_router:
    # 默认不设置路由目标
    # node_id: 0
    # node_name: ""
    type_id: 11
    type_name: "authsvr"
    policy: hash # random/round_robin/hash
    # policy_selector:
    #   api_version: apps/v1
    #   kind: StatefulSet
    #   name: authsvr
    #   namespace_name: atframework.shared
    #   service_subset: ""
    #   labels:
    #     district: cn

  crypto:
    compression_algorithms:
      - "zstd"
      - "lz4"
      - "snappy"
      - "zlib"
    algorithms:
      - "xxtea"
      - "aes-128-cbc"
      - "aes-192-cbc"
      - "aes-256-cbc"
      - "aes-128-gcm"
      - "aes-192-gcm"
      - "aes-256-gcm"
      - "chacha20"
      - "chacha20-poly1305"
      - "xchacha20-poly1305"
    kdf_algorithms:
      - "hkdf-sha256"
    key_exchange: x25519
    access_tokens:
      - "atgateway-access-token"
    update_interval: 300s
