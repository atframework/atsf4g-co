# telemetry.yaml
# vim: set sw=2 sts=2 et:
# encoding: utf-8

enabled: true

# Agent 配置
opentelemetry:
  trace:
    otlp:
      # grpc:
      #   endpoint: "127.0.0.1:4317"
      #   insecure: true
      #   # user_agent: ""
      #   max_concurrent_requests: 64
      #   max_threads: 2
      #   timeout: "10s"
      file:
        enable: true
        flush_interval: "60s"
        file_size: 20MB
        rotate_size: 3
  metrics:
    otlp:
      # grpc:
      #   endpoint: "127.0.0.1:4318"
      #   insecure: true
      #   # user_agent: ""
      #   max_concurrent_requests: 64
      #   max_threads: 2
      #   timeout: "10s"
      file:
        enable: true
        flush_interval: "60s"
        file_size: 20MB
        rotate_size: 3
  logs:
    otlp:
      # grpc:
      #   endpoint: "127.0.0.1:4319"
      #   insecure: true
      #   # user_agent: ""
      #   max_concurrent_requests: 64
      #   max_threads: 2
      #   timeout: "10s"
      file:
        enable: true
        flush_interval: "60s"
        file_size: 20MB
        rotate_size: 3

agent:
  otelcol:
    exporters:
      # start_local_test_env 会生成 var/local-test-env/openobserve/values/modules/telemetry.yaml，
      # 覆盖以下 endpoint 和 Authorization。endpoint 末尾不能带 /，由 exporter 自动追加 /v1/<signal>。
      trace:
        otlp_http/openobserve_trace:
          endpoint: "http://127.0.0.1:5080/api/atsf4g"
          headers:
            stream-name: atframework_traces
          timeout: 15s
          compression: gzip
          retry_on_failure:
            enabled: true
            initial_interval: 2s
            max_interval: 30s
            max_elapsed_time: 10m
          sending_queue:
            enabled: true
            sizer: items
            queue_size: 4096
            num_consumers: 2
            block_on_overflow: true
      metrics:
        otlp_http/openobserve_metrics:
          endpoint: "http://127.0.0.1:5080/api/atsf4g"
          headers:
            stream-name: atframework_metrics
          timeout: 15s
          compression: gzip
          retry_on_failure:
            enabled: true
            initial_interval: 2s
            max_interval: 30s
            max_elapsed_time: 10m
          sending_queue:
            enabled: true
            sizer: items
            queue_size: 4096
            num_consumers: 2
            block_on_overflow: true
      logs:
        otlp_http/openobserve_logs:
          endpoint: "http://127.0.0.1:5080/api/atsf4g"
          headers:
            stream-name: atframework_logs
          timeout: 15s
          compression: gzip
          retry_on_failure:
            enabled: true
            initial_interval: 2s
            max_interval: 30s
            max_elapsed_time: 10m
          sending_queue:
            enabled: true
            sizer: items
            queue_size: 4096
            num_consumers: 2
            block_on_overflow: true
      spanmetrics:
        otlp_http/openobserve_spanmetrics:
          endpoint: "http://127.0.0.1:5080/api/atsf4g"
          headers:
            stream-name: atframework_metrics
          timeout: 15s
          compression: gzip
          retry_on_failure:
            enabled: true
            initial_interval: 2s
            max_interval: 30s
            max_elapsed_time: 10m
          sending_queue:
            enabled: true
            sizer: items
            queue_size: 4096
            num_consumers: 2
            block_on_overflow: true
  receivers: # 默认Agent Receiver 配置
    trace:
      otlp/default_trace:
        protocols:
          grpc:
            endpoint: "127.0.0.1:4317"
    metrics:
      otlp/default_metrics:
        protocols:
          grpc:
            endpoint: "127.0.0.1:4318"
    logs:
      otlp/default_logs:
        protocols:
          grpc:
            endpoint: "127.0.0.1:4319"
  enable_trace: true
  trace_exporters: # 控制Server Exporter 配置 不控制 Agent
    otlp:
      grpc:
        endpoint: "127.0.0.1:4317"
      file:
        enable: true
    trace_blackhole: false
    spanmetrics:
      default:
        enable: true
      prometheus:
        enable: false
  enable_metrics: true
  metrics_exporters:
    otlp:
      grpc:
        endpoint: "127.0.0.1:4318"
      file:
        enable: true
  enable_logs: true
  logs_exporters:
    otlp:
      grpc:
        endpoint: "127.0.0.1:4319"
      file:
        enable: true
  shared_options:
    exporters:
      otlp:
        file:
          enable: true
      prometheus:
        # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/exporter/prometheusexporter/README.md
        pull:
          resource_to_telemetry_conversion:
            enabled: true
        # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/exporter/prometheusremotewriteexporter
        push:
          remote_write_queue:
            enabled: true
          resource_to_telemetry_conversion:
            enabled: true
          tls:
            insecure: true
          target_info:
            # 只能有一个exporter开启，否则会报时间回退冲突
            enabled: false
      file_dir: ../log
      file:
        rotation:
          max_megabytes: 10
          max_days: 3
          max_backups: 10
          localtime: true
        format: json
        # compression: zstd
    processors:
      # 裸机本地开发按 512MiB hard limit / 384MiB soft limit 限制 Collector 堆内存。
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      batch:
        default:
          timeout: 10s
        trace:
          send_batch_size: 256
          send_batch_max_size: 2048
        metrics:
          send_batch_size: 256
          send_batch_max_size: 1024
        logs:
          send_batch_size: 256
          send_batch_max_size: 2048
        spanmetrics:
          send_batch_size: 32
          send_batch_max_size: 256
    connectors:
      spanmetrics:
        default:
          metrics_flush_interval: 45s
          metrics_expiration: 15m
          series_expiration: 15m
          histogram:
            unit: ms
            explicit:
              buckets: [2ms, 8ms, 16ms, 64ms, 256ms, 1s, 8s]
          exclude_dimensions: ["service.identity", "process.pid"]
          aggregation_cardinality_limit: 4096
          resource_metrics_key_attributes: ["service.name"]
          resource_metrics_cache_size: 1024
          metric_timestamp_cache_size: 8192
          exemplars:
            enabled: true
          dimensions:
            - name: deployment.environment.name
              default: UNSET
            - name: host.name
              default: localhost
            - name: rpc.atrpc.result_code
              default: "0"
            - name: rpc.atrpc.response_code
              default: "0"
            - name: rpc.atrpc.response_code_type
              default: "0"
            - name: rpc.method
              default: UNKNOWN
            - name: rpc.service
              default: NONE
            - name: rpc.system
              default: NONE
            - name: service.area.zone_id
              default: "0"
            # 不把进程实例 ID 放入维度，避免本地反复重启制造新的时间序列。
            # collector.instance.id 由 connector 默认保留，用于满足 single-writer 约束。
            # - name: rpc.atrpc.kind
            # - name: span.name
            # - name: service.name
          aggregation_temporality: "AGGREGATION_TEMPORALITY_DELTA"
        prometheus:
          aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
group:
  cs_actor:
    agent:
      shared_options:
        processors:
          batch:
            logs:
              send_batch_size: 16
              send_batch_max_size: 8192
              timeout: 30s
      receivers: # Agent Receiver 配置
        logs:
          otlp/cs_actor:
            protocols:
              grpc:
                endpoint: "127.0.0.1:4327"
      enable_logs: true
      logs_exporters: # Server Exporter 配置
        otlp:
          grpc:
            endpoint: "127.0.0.1:4327"
          file:
            enable: true
  notification:
    agent:
      shared_options:
        processors:
          batch:
            logs:
              send_batch_size: 16
              send_batch_max_size: 8192
              timeout: 30s
      receivers:
        logs:
          otlp/notification:
            protocols:
              grpc:
                endpoint: "127.0.0.1:4337"
      enable_logs: true
      logs_exporters:
        otlp:
          grpc:
            endpoint: "127.0.0.1:4337"
          file:
            enable: true
