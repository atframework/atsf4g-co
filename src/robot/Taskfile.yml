version: "3"

includes:
  public_protocol: protocol/public/Taskfile.yml
  private_protocol: protocol/private/Taskfile.yml
  robot: atframework/robot-go/Taskfile.yml
  atframe-utils: atframework/atframe-utils-go/Taskfile.yml

dotenv:
  - build-tools.env

set: [errexit, pipefail]

shopt: [globstar]

vars:
  # 可执行文件扩展名
  INSTALL_PATH: '{{.INSTALL_PATH | default "./build/install"}}'

  # robot 构建目录（绝对路径）。CMake 集成时由父工程注入 <CMAKE_BINARY_DIR>/robot
  ROBOT_BUILD_DIR: '{{.ROBOT_BUILD_DIR | default (print .ROOT_DIR "/build")}}'

  # 下游 atframe-utils 任务把这两个变量与 PROJECT_ROOT 拼接，必须保持相对 ROOT_DIR。
  # CMake 注入同名的相对路径环境变量；直接运行回退到历史默认。
  ENV_BUILD_TARGET_DIR: '{{.ENV_BUILD_TARGET_DIR | default "build"}}'
  ENV_BUILD_TOOLS_DOWNLOAD_DIR: '{{.ENV_BUILD_TOOLS_DOWNLOAD_DIR | default "build/tools"}}'

  EXE_EXT: '{{if eq OS "windows"}}.exe{{end}}'

  # Python 虚拟环境相关变量
  PYTHON_VENV: '{{.PYTHON_VENV_PATH | default (.VIRTUAL_ENV | default (print .ROBOT_BUILD_DIR "/venv"))}}'
  PYTHON_CMD: '{{if eq OS "windows"}}python{{else}}python3{{end}}'
  PYTHON_VENV_CMD: '{{if eq OS "windows"}}Scripts/python.exe{{else}}bin/python3{{end}}'

  # mako 模板引擎（生成器）。CMake 集成时注入父工程 src/tools/generate-for-pb 的版本，
  # 此时 robot-go 的 third_party/mako-generator 子模块无需初始化。
  MAKO_GENERATOR_PY: '{{.MAKO_GENERATOR_PY | default (print .ROOT_DIR "/atframework/robot-go/third_party/mako-generator/mako-generator.py")}}'
  # server-client 模式：pid/port 文件。CMake 注入父级文件以复用父级 server；直接运行使用 robot 本地文件，
  # 使连续运行之间可复用缓存。--server-auto-start/--client-mode 在 rpc_handle 中无条件传入。
  MAKO_GENERATOR_SERVER_PID_FILE: '{{.MAKO_GENERATOR_SERVER_PID_FILE | default (print .ROBOT_BUILD_DIR "/mako-generator.server.pid")}}'
  MAKO_GENERATOR_SERVER_PORT_FILE: '{{.MAKO_GENERATOR_SERVER_PORT_FILE | default (print .ROBOT_BUILD_DIR "/mako-generator.server.port")}}'

tasks:
  all:
    desc: "Generate Protocol, Config and Robot Code"
    cmds:
      - cmd: pwsh -NoProfile -Command "New-Item -ItemType Directory -Force '{{.ROBOT_BUILD_DIR}}' | Out-Null"
        platforms: [windows]
      - cmd: mkdir -p "{{.ROBOT_BUILD_DIR}}"
        platforms: [linux, darwin]
      - task: submodule_update
      - task: build-tools-prepare
      - task: generate
      - task: rpc_handle
      - task: build

  build-tools-prepare:
    desc: "Prepare build tools (protoc, python)"
    cmds:
      - task: _install-build-settings
      - task: _prepare-protoc
      - task: _prepare-python

  _install-build-settings:
    desc: "Install build settings tools"
    cmds:
      - task: atframe-utils:install-build-settings-tools
        vars:
          PROJECT_ROOT: "{{.ROOT_DIR}}"
    silent: true

  _prepare-protoc:
    desc: "Prepare protoc and related plugins"
    cmds:
      - task: atframe-utils:install-protoc
        vars:
          PROJECT_ROOT: "{{.ROOT_DIR}}"
    silent: false

  _prepare-python-deps:
    desc: "Setup Python virtual environment"
    cmds:
      - cmd: pwsh -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/script/prepare-python-venv.ps1" -PythonCmd "{{.PYTHON_CMD}}" -PythonVenv "{{.PYTHON_VENV}}" -RequirementsFile "{{.ROOT_DIR}}/third_party/python_env/requirements.txt"
        platforms: [windows]
      - cmd: sh "{{.ROOT_DIR}}/script/prepare-python-venv.sh" "{{.PYTHON_CMD}}" "{{.PYTHON_VENV}}" "{{.ROOT_DIR}}/third_party/python_env/requirements.txt"
        platforms: [linux, darwin]
    silent: true

  _prepare-python:
    desc: "Prepare Python environment"
    deps:
      - _prepare-python-deps
    cmds:
      - cmd: pwsh -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/script/prepare-python.ps1" -PythonVenv "{{.PYTHON_VENV}}" -BuildSettingBin "{{.ENV_BUILD_TOOLS_DOWNLOAD_DIR}}/build_setting{{.EXE_EXT}}" -SettingsFile "{{.ENV_BUILD_TARGET_DIR}}/build-settings.json" -RequirementsFile "{{.ROOT_DIR}}/atframework/robot-go/third_party/xres-code-generator/requirements.txt"
        platforms: [windows]
      - cmd: sh "{{.ROOT_DIR}}/script/prepare-python.sh" "{{.PYTHON_VENV}}" "{{.ENV_BUILD_TOOLS_DOWNLOAD_DIR}}/build_setting{{.EXE_EXT}}" "{{.ENV_BUILD_TARGET_DIR}}/build-settings.json" "{{.ROOT_DIR}}/atframework/robot-go/third_party/xres-code-generator/requirements.txt"
        platforms: [linux, darwin]
    silent: true

  submodule_update:
    desc: "Update Submodule"
    cmds:
      - git submodule update --init atframework/atframe-utils-go
      - git submodule update --init atframework/robot-go
      - task: robot:submodule_update

  generate:
    desc: "Generate Protocol and Config"
    vars:
      PROTOC_EXEC_BIN:
        sh: '"{{.ENV_BUILD_TOOLS_DOWNLOAD_DIR}}/build_setting{{.EXE_EXT}}" get protoc -settings-file "{{.ENV_BUILD_TARGET_DIR}}/build-settings.json"'
      PYTHON_BIN_PATH:
        sh: '"{{.ENV_BUILD_TOOLS_DOWNLOAD_DIR}}/build_setting{{.EXE_EXT}}" get python -settings-file "{{.ENV_BUILD_TARGET_DIR}}/build-settings.json"'
    cmds:
      - task: _generate-protocol
        vars:
          PROTOC_EXEC_BIN: "{{.PROTOC_EXEC_BIN}}"
      - task: _generate-config
        vars:
          PYTHON_BIN_PATH: "{{.PYTHON_BIN_PATH}}"

  _generate-protocol:
    desc: "Generate Protocol"
    cmds:
      - task: public_protocol:generate-protocol-pb
        vars:
          OUTPUT_DIR: "{{.ROBOT_BUILD_DIR}}/pb"
          PROTOC_EXEC_BIN: "{{.PROTOC_EXEC_BIN}}"
          XRES_PROTOCOL_PATH: "{{.ROOT_DIR}}/atframework/robot-go/third_party/protocols"

      - task: public_protocol:generate-protocol-code
        vars:
          PROTOC_EXEC_BIN: "{{.PROTOC_EXEC_BIN}}"
          XRES_PROTOCOL_PATH: "{{.ROOT_DIR}}/atframework/robot-go/third_party/protocols"
          STAGING_DIR: "{{.ROBOT_BUILD_DIR}}/_staging/protocol-public"

      - task: private_protocol:generate-protocol-pb
        vars:
          OUTPUT_DIR: "{{.ROBOT_BUILD_DIR}}/pb"
          PROTOC_EXEC_BIN: "{{.PROTOC_EXEC_BIN}}"
          XRES_PROTOCOL_PATH: "{{.ROOT_DIR}}/atframework/robot-go/third_party/protocols"

      - task: private_protocol:generate-protocol-code
        vars:
          PROTOC_EXEC_BIN: "{{.PROTOC_EXEC_BIN}}"
          XRES_PROTOCOL_PATH: "{{.ROOT_DIR}}/atframework/robot-go/third_party/protocols"
          STAGING_DIR: "{{.ROBOT_BUILD_DIR}}/_staging/protocol-private"

  _generate-config:
    desc: "Generate Config"
    cmds:
      - task: robot:generate-code
        vars:
          PYTHON_BIN_PATH: "{{.PYTHON_BIN_PATH}}"
          OUTPUT_DIR: "{{.ROOT_DIR}}/config"
          STAGING_DIR: "{{.ROBOT_BUILD_DIR}}/_staging/config"
          CONFIG_PROTOCOL_IMPORT_PATH: "github.com/atframework/atsf4g-co/component/public/protocol/config"
          RES_CONFIG_PB: "{{.ROBOT_BUILD_DIR}}/pb/ALL.pb"

    dir: "{{.TASKFILE_DIR}}"

  rpc_handle:
    desc: "Generate RPC Handle Code"
    vars:
      # 仅依据环境变量是否注入（先于下面的默认值解析）决定是否启用基座解释器 shim。
      # 渲染结果不允许出现 $（会被 mvdan/sh 展开），故用 true/false 字符串。
      MAKO_BASE_SHIM: '{{if .MAKO_GENERATOR_PYTHON_BIN}}false{{else}}true{{end}}'
      PYTHON_BIN_PATH:
        sh: '"{{.ENV_BUILD_TOOLS_DOWNLOAD_DIR}}/build_setting{{.EXE_EXT}}" get python -settings-file "{{.ENV_BUILD_TARGET_DIR}}/build-settings.json"'
      # CMake 集成时注入父级解释器，保证 client 与父级 server 进程镜像一致（复用前提）；
      # 直接运行回退到 robot venv python（独立 server 复用自洽）。
      MAKO_GENERATOR_PYTHON_BIN: '{{.MAKO_GENERATOR_PYTHON_BIN | default .PYTHON_BIN_PATH}}'
    # preconditions 不支持 platforms 过滤（go-task 会全部执行）；test -f 在 mvdan/sh
    # 内置实现下 Windows/Linux 均可用，单一检查即可跨平台。
    preconditions:
      - sh: test -f "{{.MAKO_GENERATOR_PY}}" && test -f "{{.ROBOT_BUILD_DIR}}/pb/ALL.pb"
        msg: "mako-generator script or pb input missing. MAKO_GENERATOR_PY={{.MAKO_GENERATOR_PY}} ; pb={{.ROBOT_BUILD_DIR}}/pb/ALL.pb"
    cmds:
      - cmd: pwsh -NoProfile -Command "New-Item -ItemType Directory -Force 'rpc_handle', '{{.ROBOT_BUILD_DIR}}' | Out-Null"
        platforms: [windows]
      - cmd: mkdir -p rpc_handle "{{.ROBOT_BUILD_DIR}}"
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/script/rpc-handle.ps1" -PythonBin "{{.MAKO_GENERATOR_PYTHON_BIN}}" -MakoGeneratorPy "{{.MAKO_GENERATOR_PY}}" -ServerPidFile "{{.MAKO_GENERATOR_SERVER_PID_FILE}}" -ServerPortFile "{{.MAKO_GENERATOR_SERVER_PORT_FILE}}" -PackagePrefix "{{.MAKO_GENERATOR_PACKAGE_PREFIX}}" -ProjectDir "{{.ROOT_DIR}}" -PbFile "{{.ROBOT_BUILD_DIR}}/pb/ALL.pb" -RuleFile "{{.ROOT_DIR}}/generate-for-pb.yaml" -UseBaseInterpreter {{.MAKO_BASE_SHIM}}
        platforms: [windows]
      - cmd: sh "{{.ROOT_DIR}}/script/rpc-handle.sh" "{{.MAKO_GENERATOR_PYTHON_BIN}}" "{{.MAKO_GENERATOR_PY}}" "{{.MAKO_GENERATOR_SERVER_PID_FILE}}" "{{.MAKO_GENERATOR_SERVER_PORT_FILE}}" "{{.MAKO_GENERATOR_PACKAGE_PREFIX}}" "{{.ROOT_DIR}}" "{{.ROBOT_BUILD_DIR}}/pb/ALL.pb" "{{.ROOT_DIR}}/generate-for-pb.yaml"
        platforms: [linux, darwin]

  build:
    desc: "Build Robot Code"
    cmds:
      - cmd: pwsh -NoProfile -Command "New-Item -ItemType Directory -Force '{{.INSTALL_PATH}}/bin' | Out-Null"
        platforms: [windows]
      - cmd: mkdir -p "{{.INSTALL_PATH}}/bin"
        platforms: [linux, darwin]
      - go build -o '{{.INSTALL_PATH}}/bin/robot{{.EXE_EXT}}' ./main.go
