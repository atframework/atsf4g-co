version: "3"

tasks:
  generate-protocol-pb:
    desc: "Generate Protocol pb"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - cmd: pwsh -NoProfile -ExecutionPolicy Bypass -File "{{.TASKFILE_DIR}}/../../script/protocol-gen-pb.ps1" -ProtocBin "{{.PROTOC_EXEC_BIN}}" -OutputFile "{{.OUTPUT_DIR}}/ALL.pb" -ProtoPath '../../../server_frame/protocol/public;{{.XRES_PROTOCOL_PATH}}/core;{{.XRES_PROTOCOL_PATH}}/code' -ProtoDir '../../../server_frame/protocol/public/protocol/common;../../../server_frame/protocol/public/protocol/config;../../../server_frame/protocol/public/protocol/extension;../../../server_frame/protocol/public/protocol/pbdesc;{{.XRES_PROTOCOL_PATH}}/core/protocol/extension/v3' -ProtoFile '{{.XRES_PROTOCOL_PATH}}/core/protocol/config/pb_header_v3.proto;{{.XRES_PROTOCOL_PATH}}/code/protocol/extension/xrescode_extensions_v3.proto'
        platforms: [windows]
      - cmd: sh "{{.TASKFILE_DIR}}/../../script/protocol-gen-pb.sh" "{{.PROTOC_EXEC_BIN}}" "{{.OUTPUT_DIR}}/ALL.pb" '../../../server_frame/protocol/public;{{.XRES_PROTOCOL_PATH}}/core;{{.XRES_PROTOCOL_PATH}}/code' '../../../server_frame/protocol/public/protocol/common;../../../server_frame/protocol/public/protocol/config;../../../server_frame/protocol/public/protocol/extension;../../../server_frame/protocol/public/protocol/pbdesc;{{.XRES_PROTOCOL_PATH}}/core/protocol/extension/v3' '{{.XRES_PROTOCOL_PATH}}/core/protocol/config/pb_header_v3.proto;{{.XRES_PROTOCOL_PATH}}/code/protocol/extension/xrescode_extensions_v3.proto'
        platforms: [linux, darwin]
    silent: true

  generate-protocol-code:
    desc: "Generate Protocol code"
    dir: "{{.TASKFILE_DIR}}"
    vars:
      # protoc 无条件重写输出，先生成到 staging 再按内容稳定发布，保持未变化输出的时间戳
      STAGING_DIR: '{{.STAGING_DIR | default (print .TASKFILE_DIR "/.staging")}}'
    cmds:
      - cmd: pwsh -NoProfile -ExecutionPolicy Bypass -File "{{.TASKFILE_DIR}}/../../script/protocol-gen-code.ps1" -ProtocBin "{{.PROTOC_EXEC_BIN}}" -ProtoPath '{{.XRES_PROTOCOL_PATH}}/core;{{.XRES_PROTOCOL_PATH}}/code;../../../server_frame/protocol/public' -ProtoDir '../../../server_frame/protocol/public/protocol/common;../../../server_frame/protocol/public/protocol/extension;../../../server_frame/protocol/public/protocol/config;../../../server_frame/protocol/public/protocol/pbdesc' -StagingDir "{{.STAGING_DIR}}" -PublishRoot "{{.TASKFILE_DIR}}"
        platforms: [windows]
      - cmd: sh "{{.TASKFILE_DIR}}/../../script/protocol-gen-code.sh" "{{.PROTOC_EXEC_BIN}}" '{{.XRES_PROTOCOL_PATH}}/core;{{.XRES_PROTOCOL_PATH}}/code;../../../server_frame/protocol/public' '../../../server_frame/protocol/public/protocol/common;../../../server_frame/protocol/public/protocol/extension;../../../server_frame/protocol/public/protocol/config;../../../server_frame/protocol/public/protocol/pbdesc' "{{.STAGING_DIR}}" "{{.TASKFILE_DIR}}"
        platforms: [linux, darwin]
    silent: true
