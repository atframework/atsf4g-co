version: "3"

tasks:
  generate-protocol-pb:
    desc: "Generate Protocol pb"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - cmd: pwsh -NoProfile -ExecutionPolicy Bypass -File "{{.TASKFILE_DIR}}/../../script/protocol-gen-pb.ps1" -ProtocBin "{{.PROTOC_EXEC_BIN}}" -OutputFile "{{.OUTPUT_DIR}}/private.pb" -IncludeImports -ProtoPath '../../../../atframework/libatapp/include;{{.XRES_PROTOCOL_PATH}}/core;{{.XRES_PROTOCOL_PATH}}/code;../../../server_frame/protocol/private;../../../server_frame/protocol/public' -ProtoDir '../../../server_frame/protocol/private/protocol/common;../../../server_frame/protocol/private/protocol/config;../../../server_frame/protocol/private/protocol/extension;../../../server_frame/protocol/private/protocol/pbdesc;../../../../atframework/libatapp/include/atframe'
        platforms: [windows]
      - cmd: sh "{{.TASKFILE_DIR}}/../../script/protocol-gen-pb.sh" "{{.PROTOC_EXEC_BIN}}" "{{.OUTPUT_DIR}}/private.pb" '../../../../atframework/libatapp/include;{{.XRES_PROTOCOL_PATH}}/core;{{.XRES_PROTOCOL_PATH}}/code;../../../server_frame/protocol/private;../../../server_frame/protocol/public' '../../../server_frame/protocol/private/protocol/common;../../../server_frame/protocol/private/protocol/config;../../../server_frame/protocol/private/protocol/extension;../../../server_frame/protocol/private/protocol/pbdesc;../../../../atframework/libatapp/include/atframe' '' true
        platforms: [linux, darwin]
    silent: true

  generate-protocol-code:
    desc: "Generate Protocol code"
    dir: "{{.TASKFILE_DIR}}"
    vars:
      # protoc 无条件重写输出，先生成到 staging 再按内容稳定发布，保持未变化输出的时间戳
      STAGING_DIR: '{{.STAGING_DIR | default (print .TASKFILE_DIR "/.staging")}}'
    cmds:
      - cmd: pwsh -NoProfile -ExecutionPolicy Bypass -File "{{.TASKFILE_DIR}}/../../script/protocol-gen-code.ps1" -ProtocBin "{{.PROTOC_EXEC_BIN}}" -ProtoPath '{{.XRES_PROTOCOL_PATH}}/core;{{.XRES_PROTOCOL_PATH}}/code;../../../server_frame/protocol/private;../../../server_frame/protocol/public;../../../../atframework/libatapp/include' -ProtoDir '../../../server_frame/protocol/private/protocol/common;../../../server_frame/protocol/private/protocol/extension;../../../server_frame/protocol/private/protocol/config;../../../server_frame/protocol/private/protocol/pbdesc' -StagingDir "{{.STAGING_DIR}}" -PublishRoot "{{.TASKFILE_DIR}}"
        platforms: [windows]
      - cmd: sh "{{.TASKFILE_DIR}}/../../script/protocol-gen-code.sh" "{{.PROTOC_EXEC_BIN}}" '{{.XRES_PROTOCOL_PATH}}/core;{{.XRES_PROTOCOL_PATH}}/code;../../../server_frame/protocol/private;../../../server_frame/protocol/public;../../../../atframework/libatapp/include' '../../../server_frame/protocol/private/protocol/common;../../../server_frame/protocol/private/protocol/extension;../../../server_frame/protocol/private/protocol/config;../../../server_frame/protocol/private/protocol/pbdesc' "{{.STAGING_DIR}}" "{{.TASKFILE_DIR}}"
        platforms: [linux, darwin]
    silent: true
