# Pool 999990401 / level 999904. See matching_waiting_cases.md. Fresh accounts, one run only.
login true wrfille 1 7 0 1 1
character_create true wrfille 1 7 0 1 1
matching_level_select true wrfille 1 3 0 1 1 999904 default 1
matching_level_select true wrfille 3 5 0 1 1 999904 default 2
matching_level_select true wrfille 5 7 0 1 1 999904 default 1

# Two full solo factions satisfy initial readiness. Wait for both before adding anyone.
matching_start true wrfille 1 2 0 1 1
matching_start true wrfille 2 3 0 1 1
matching_wait_admitted true wrfille 1 3 0 1 1 150 999904
matching_assert_admission true wrfille 2 3 0 1 1 wrfille1 same different

# A new, incomplete faction joins the existing DS. Then fill that faction with another Unit.
matching_start true wrfille 3 4 0 1 1
matching_wait_admitted true wrfille 3 4 0 1 1 60 999904
matching_assert_admission true wrfille 3 4 0 1 1 wrfille1 same different
matching_assert_admission true wrfille 3 4 0 1 1 wrfille2 same different
matching_start true wrfille 4 5 0 1 1
matching_wait_admitted true wrfille 4 5 0 1 1 60 999904
matching_assert_admission true wrfille 4 5 0 1 1 wrfille3 same same
matching_assert_unchanged true wrfille 1 5 0 1 1

# Four successful users close the room. An extra solo must search, then form a different DS with its peer.
matching_start true wrfille 5 6 0 1 1
matching_assert_searching true wrfille 5 6 0 1 1
matching_start true wrfille 6 7 0 1 1
matching_wait_admitted true wrfille 5 7 0 1 1 150 999904
matching_assert_admission true wrfille 5 6 0 1 1 wrfille1 different any
matching_assert_admission true wrfille 6 7 0 1 1 wrfille5 same different
matching_assert_unchanged true wrfille 1 5 0 1 1
logout true wrfille 1 7 0 1 1
