# 2v2 room and teammate matchmaking acceptance case.
# Requires level 2001999 -> pool 2001999 -> template 998 (two factions, two users each).
# Format: case error_break openid_prefix id_start id_end target_qps user_batch_count run_time [args...]
login true 1000 71001 71005 0 1 1

# Start the first teammate pair before the second pair so deterministic battle faction IDs can be asserted.
# Args: level_type preferred_level_id region select_type fill_policy level_ids_csv
matching_start true 1000 71001 71003 0 1 1 2001 2001999 cn 2 2 2001999
matching_start true 1000 71003 71005 0 1 1 2001 2001999 cn 2 2 2001999

# matching_wait stops at CONFIRMING and refreshes each robot's unit_id before confirmation.
matching_wait true 1000 71001 71005 0 1 1 30 1
matching_confirm true 1000 71001 71005 0 1 1 true

# faction_id is exposed only after battle creation begins.
matching_wait true 1000 71001 71005 0 1 1 30 1
matching_assert_faction true 1000 71001 71003 0 1 1 1001
matching_assert_faction true 1000 71003 71005 0 1 1 1002

logout true 1000 71001 71005 0 1 1
