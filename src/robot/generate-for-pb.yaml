configure:
  encoding: "UTF-8"
  overwrite: false
  paths: []
  package_prefix: []

rules:
  - service:
      name: "atframework.shared.LobbysvrClientService"
      overwrite: true
      output_directory: "rpc_handle/lobbysvr"
      service_template:
        - overwrite: true
          input: "template/robot_rpc_handle.go.mako"
          output: "rpc_handle_lobby.go"
  - service:
      name: "atframework.shared.AuthsvrClientService"
      overwrite: true
      output_directory: "rpc_handle/authsvr"
      service_template:
        - overwrite: true
          input: "template/robot_rpc_handle.go.mako"
          output: "rpc_handle_auth.go"
