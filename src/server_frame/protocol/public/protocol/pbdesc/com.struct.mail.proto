syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;

option go_package = "github.com/atframework/atsf4g-co/component/public/protocol/pbdesc";

import "google/protobuf/timestamp.proto";

import "protocol/common/com.struct.mail.common.proto";
import "protocol/common/com.struct.item.common.proto";
import "protocol/pbdesc/com.struct.proto";

package atframework.shared;

/////////////////////////////////////////////////////////////////////////
// 邮件数据
/////////////////////////////////////////////////////////////////////////

message DMailUserInfo {
  DUserProfile profile = 1;
}

message DMailContent {
  int64 mail_id = 1;
  int32 major_type = 2;  // @see EnMailMajorType
  int32 minor_type = 3;
  int32 status = 4;  // 仅传输据给客户端时有效， @see EnMailStatusType
  string title = 5;
  string content = 6;
  repeated DItemOffset attachments = 7;
  DMailUserInfo sender = 8;
  int32 flags = 9;           // @see EnMailFlagType

  google.protobuf.Timestamp delivery_time = 21;
  google.protobuf.Timestamp show_time = 22;
  google.protobuf.Timestamp start_time = 23;
  google.protobuf.Timestamp expired_time = 24;
  // repeated DConditionRule mail_limit = 25;
  google.protobuf.Timestamp remove_time = 26;  // 全服邮件允许失效后仍然存在一段时间
  // 如果大于0，则表示需要从接收到邮件开始重置过期时间。通常用于全服邮件中每个玩家独立核算过期时间
  google.protobuf.Timestamp resolve_expired_time = 27;

  // 客户端渲染的模板要透传邮件模板ID和插件信息
  int32 mail_template_id = 31;
  map<string, string> mail_template_extensions = 32;
}

message DMailRecord {
  int64 mail_id = 1;
  int32 major_type = 2;  // @see EnMailMajorType
  int32 minor_type = 3;
  int32 status = 4;  // @see EnMailStatusType
  google.protobuf.Timestamp delivery_time = 21;
  google.protobuf.Timestamp show_time = 22;
  google.protobuf.Timestamp start_time = 23;
  google.protobuf.Timestamp expired_time = 24;
  google.protobuf.Timestamp remove_time = 26;  // 全服邮件允许失效后仍然存在一段时间
  // 如果大于0，则表示需要从接收到邮件开始重置过期时间。通常用于全服邮件中每个玩家独立核算过期时间
  google.protobuf.Timestamp resolve_expired_time = 27;

  bool is_global_mail = 101;
  uint32 fetch_error_count = 102;
}

message DMailOperationResult {
  int32 result = 1;  // 操作返回码，仅给客户端使用
  DMailRecord record = 2;
}
