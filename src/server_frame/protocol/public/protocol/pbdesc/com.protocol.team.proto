syntax = "proto3";

option optimize_for = SPEED;
option cc_enable_arenas = true;

option go_package = "github.com/atframework/atsf4g-co/component/public/protocol/pbdesc";

import "google/protobuf/any.proto";

import "protocol/pbdesc/com.struct.team.proto";
import "protocol/pbdesc/com.struct.team.shared.proto";
import "protocol/pbdesc/com.struct.proto";

package atframework.shared;

// Placeholder definitions for team protocol messages referenced by com.protocol.proto.
// These exist so proto generation succeeds; real definitions should be added here.

message CSTeamSendInvitationReq {
  // 不指定team_key时，表示邀请用户加入当前玩家所在的默认队伍，如果默认队伍不存在，会先创建一个
  atframework.team.DTeamKey team_key = 1;
  atframework.shared.DUserIDKey user_key = 2;
}

message SCTeamSendInvitationRsp {}

message CSTeamApproveInvitationReq {
  atframework.team.DTeamKey team_key = 1;
  atframework.shared.DUserIDKey user_key = 2;
}

message SCTeamApproveInvitationRsp {}

message CSTeamRejectInvitationReq {
  atframework.team.DTeamKey team_key = 1;
  atframework.shared.DUserIDKey user_key = 2;
}

message SCTeamRejectInvitationRsp {}

message CSTeamExitReq {
  atframework.team.DTeamKey team_key = 1;
}

message SCTeamExitRsp {}

message CSTeamRemoveMemberReq {
  atframework.team.DTeamKey team_key = 1;
  atframework.shared.DUserIDKey user_key = 2;
}

message SCTeamRemoveMemberRsp {}

message CSTeamUpdateMemberDataReq {
  atframework.team.DTeamKey team_key = 1;

  repeated DTeamMemberSharedDataModule data = 5;
}

message SCTeamUpdateMemberDataRsp {}

message CSTeamUpdateMemberRoleReq {
  atframework.team.DTeamKey team_key = 1;
  atframework.shared.DUserIDKey user_key = 2;

  atframework.team.EnTeamPermissionRole role = 4;
}

message SCTeamUpdateMemberRoleRsp {}

message CSTeamUpdateTeamDataReq {
  atframework.team.DTeamKey team_key = 1;

  repeated DTeamSharedDataModule data = 5;
}

message SCTeamUpdateTeamDataRsp {}

message CSTeamSendJoinRequestReq {
  atframework.team.DTeamKey team_key = 1;
}

message SCTeamSendJoinRequestRsp {}

message CSTeamAcceptJoinRequestReq {
  atframework.team.DTeamKey team_key = 1;
  atframework.shared.DUserIDKey user_key = 2;
}

message SCTeamAcceptJoinRequestRsp {}

message CSTeamRejectJoinRequestReq {
  atframework.team.DTeamKey team_key = 1;
  atframework.shared.DUserIDKey user_key = 2;
}

message SCTeamRejectJoinRequestRsp {}

message CSTeamTransferCaptainReq {
  atframework.team.DTeamKey team_key = 1;
  atframework.shared.DUserIDKey user_key = 2;
}

message SCTeamTransferCaptainRsp {}
