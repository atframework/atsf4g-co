syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

import "protocol/common/com.struct.dtmq.common.proto";
import "protocol/pbdesc/com.struct.proto";

option go_package = "github.com/atframework/atsf4g-co/component/public/protocol/pbdesc";

package atframework.team;

// 注意和DtMq.xlsx 表对应，多个模块之间类型不要冲突
enum EnTeamChannelType {
  EN_TEAM_CHANNEL_TYPE_INVALID = 0;
  EN_TEAM_CHANNEL_TYPE_TEAM_ROOM = 11;  // 组队房间
}

enum EnTeamExitReason {
  EN_TEAM_EXIT_REASON_DEFAULT = 0;
  EN_TEAM_EXIT_REASON_LOGOUT = 1;
  EN_TEAM_EXIT_REASON_EXPIRED = 2;
  EN_TEAM_EXIT_REASON_DESTROY_TEAM = 3;
  EN_TEAM_EXIT_REASON_REMOVE_MEMBER = 4;
  EN_TEAM_EXIT_REASON_CANCEL = 5;
  EN_TEAM_EXIT_REASON_UNSUBSCRIBE_TEAM_CHANNEL = 6;
  EN_TEAM_EXIT_REASON_OFFLINE_EXPIRED = 7;
  EN_TEAM_EXIT_REASON_EXIT_TEAM = 8;
  EN_TEAM_EXIT_REASON_UPDATE_CUSTOM_LOCK_ERROR = 11;
  EN_TEAM_EXIT_REASON_MODULE_BAN = 12;
  EN_TEAM_EXIT_REASON_IN_ANOTHER_TEAM = 13;
}

enum EnTeamAdmissionCancelReason {
  EN_TEAM_INVITATION_CANCEL_REASON_UNKNOWN = 0;
  EN_TEAM_INVITATION_CANCEL_REASON_TEAM_ID_NOT_MATCHED = 1;
  EN_TEAM_INVITATION_CANCEL_REASON_IS_MATCHING = 2;
  EN_TEAM_INVITATION_CANCEL_REASON_IS_IN_BATTLE = 3;
  EN_TEAM_INVITATION_CANCEL_REASON_TEAM_FULL = 4;
  EN_TEAM_INVITATION_CANCEL_REASON_IS_IN_TEAM = 5;
  EN_TEAM_INVITATION_CANCEL_REASON_TIMEOUT = 6;
  EN_TEAM_INVITATION_CANCEL_REASON_IS_PRE_SEARCH = 7;
  EN_TEAM_INVITATION_CANCEL_REASON_SEASON_ROLE_NOT_FOUND = 8;
  EN_TEAM_INVITATION_CANCEL_REASON_IS_IN_PRIVATE_ROOM = 9;
  EN_TEAM_INVITATION_CANCEL_REASON_MODULE_UNLOCK = 10;
  EN_TEAM_INVITATION_CANCEL_REASON_SEASON_NOT_MATCH = 11;
}

enum EnTeamAdmissionRejectReason {
  EN_TEAM_INVITATION_REJECT_REASON_UNKNOWN = 0;
  EN_TEAM_INVITATION_REJECT_REASON_INVITEE_REJECT = 1;
  EN_TEAM_INVITATION_REJECT_REASON_IS_IN_TEAM = 2;
  EN_TEAM_INVITATION_REJECT_REASON_MODULE_BAN = 3;
  EN_TEAM_INVITATION_REJECT_REASON_IS_IN_MATCHING = 4;
  EN_TEAM_INVITATION_REJECT_REASON_IS_IN_BATTLE = 5;
  EN_TEAM_INVITATION_REJECT_REASON_IS_PRE_SEARCH = 6;
  EN_TEAM_INVITATION_REJECT_REASON_SEASON_NOT_MATCH = 7;
}

enum EnTeamSourceType {
  EN_TEAM_SOURCE_TYPE_NONE = 0;
  EN_TEAM_SOURCE_TYPE_SNS_PLATFORM = 1;
  EN_TEAM_SOURCE_TYPE_FRIEND = 2;
  EN_TEAM_SOURCE_TYPE_MATCH = 3;
  EN_TEAM_SOURCE_TYPE_BATTLE = 4;
}

enum EnTeamPermissionType {
  EN_TEAM_PERMISSION_TYPE_MEMBER = 0;
  EN_TEAM_PERMISSION_TYPE_PUBLIC = 1;
}

message DTeamAnyData {
  EnTeamPermissionType permission = 1;
  google.protobuf.Any data = 2;
}

message DTeamKey {
  int64 team_id = 1;
  // 队伍所属区服；和 team_id 一起构成队伍唯一标识，路由/分片以 (zone_id, team_id) 为 key
  uint32 zone_id = 2;
}

// 注意必须低于 1000
enum EnTeamPermissionRole {
  EN_TEAM_MEMBER_ROLE_GUEST = 0;
  EN_TEAM_MEMBER_ROLE_NORMAL = 100;
  EN_TEAM_MEMBER_ROLE_ADMIN = 200;
  EN_TEAM_MEMBER_ROLE_OWNER = 300;
}

// 队伍数据检查器
// 由于Client端接收到的队伍数据可能有一定延迟，为了解决一致性未提，这里提供简单的数据操作冲突机制

message DTeamConditionMinMaxValue {
  int64 min_value = 1;  // 最小值(0为不限制)
  int64 max_value = 2;  // 最大值(0为不限制)
}

message DTeamMemberConditionChecker {
  // 共享的成员数据检查，所有的值必须相等（即与关系）
  // shared_member_data 中的 value
  // 对应DTeamMember.shared_member_data里的DTeamAnyData的data字段，permission字段不参与检查
  map<int64, google.protobuf.Any> shared_member_data = 1;

  // 权限检查
  DTeamConditionMinMaxValue permission = 2;
}

message DTeamConditionChecker {
  // 共享的队伍数据检查，所有的值必须相等（即与关系）
  // shared_team_data 中的 value 对应DTeamStorage.shared_team_data里的DTeamAnyData的data字段，permission字段不参与检查
  map<int64, google.protobuf.Any> shared_team_data = 1;

  // 队伍成员数量
  DTeamConditionMinMaxValue members_count = 2;

  message DMemberConditionGroup {
    oneof scope_type {
      // 指定成员
      atframework.shared.DUserIDKey user_key = 1;
      // 所有成员
      bool all_members = 2;
      // 任意成员
      bool any_members = 3;
      // 满足条件的成员数量限制
      DTeamConditionMinMaxValue members_count = 4;
      // 满足条件的成员数量百分比限制
      DTeamConditionMinMaxValue members_percent = 5;
    }

    DTeamMemberConditionChecker member_condition = 11;
  }
  // 成员的条件组，所有的值必须相等（即与关系）
  repeated DMemberConditionGroup member_condition_group = 11;
}

message DTeamMember {
  atframework.shared.DUserIDKey user_key = 1;
  atframework.dtmq.DChannelIdKey user_channel = 2;

  // 入队时间
  google.protobuf.Timestamp joined_timepoint = 3;

  // 最近一次成员心跳时间，用于离线过期清理
  google.protobuf.Timestamp last_heartbeat_timepoint = 4;

  EnTeamPermissionRole role = 5;

  // 入队方式和额外数据
  EnTeamSourceType team_source_type = 6;
  google.protobuf.Any team_source_data = 7;

  string client_version = 9;
  uint64 user_router_server_id = 10;

  // 最后收到的组队通道的消息sequence和hash code
  int64 acknowledge_action_sequence = 11;
  uint64 acknowledge_action_hash_code = 12;

  // 共享的成员数据，通常是阵容信息、状态信息等。
  // 数据按key-value形式下发，注意各个模块使用时key要区分开
  map<int64, DTeamAnyData> shared_member_data = 13;
}

message DTeamMemberUpdateData {
  atframework.shared.DUserIDKey user_key = 1;
  atframework.dtmq.DChannelIdKey user_channel = 2;

  // 更新条件检查器，每个condition是或关系，内部的各项数据是与关系
  // 本字段仅作条件检查使用。如果通过，最终的Event数据会被裁剪掉
  repeated DTeamConditionChecker condition = 5;

  string client_version = 7;
  uint64 user_router_server_id = 8;

  // 共享的成员数据，通常是阵容信息、状态信息等。
  // 数据按key-value形式下发，注意各个模块使用时key要区分开
  map<int64, DTeamAnyData> shared_member_data = 13;
}

message DTeamMemberJoinData {
  DTeamKey team_key = 1;
  atframework.shared.DUserIDKey user_key = 2;
  atframework.dtmq.DChannelIdKey team_channel = 3;
  EnTeamPermissionRole user_role = 4;

  atframework.shared.DUserIDKey captain_user_key = 11;
}

message DTeamMemberRemoveData {
  DTeamKey team_key = 1;
  atframework.shared.DUserIDKey user_key = 2;

  // 退出原因
  EnTeamExitReason remove_member_reason = 8;
}

// 设置成员角色
message DTeamMemberSetRole {
  atframework.shared.DUserIDKey user_key = 1;

  // 目标角色，必须高于 GUEST 且不能高于操作者自身的角色
  EnTeamPermissionRole role = 2;
}

message DTeamAdmissionResult {
  atframework.shared.DUserIDKey inviter = 1;
  atframework.shared.DUserIDKey invitee = 2;
  DTeamKey team_key = 3;

  EnTeamAdmissionCancelReason cancel_reason = 21;
  EnTeamAdmissionRejectReason reject_reason = 22;
}

message DTeamInvitation {
  atframework.shared.DUserIDKey inviter = 1;
  atframework.shared.DUserIDKey invitee = 2;
  atframework.dtmq.DChannelIdKey invitee_private_channel = 3;
  DTeamKey team_key = 4;

  EnTeamSourceType team_source_type = 6;
  google.protobuf.Any team_source_data = 7;

  // 开始事件
  google.protobuf.Timestamp start_timepoint = 8;
  // 失效时间
  google.protobuf.Timestamp expired_timepoint = 9;

  // 共享的发邀请或盛情加入请求的数据，通常是状态信息的子集。
  // 数据按key-value形式下发，注意各个模块使用时key要区分开
  map<int64, DTeamAnyData> team_admission_data = 14;

  message MemberAdmissionData {
    atframework.shared.DUserIDKey user_key = 1;
    map<int64, DTeamAnyData> member_admission_data = 2;
  }
  repeated MemberAdmissionData member_admission_data = 15;
}

message DTeamJoinRequest {
  DTeamKey team_key = 1;
  atframework.shared.DUserIDKey requester = 2;
  atframework.dtmq.DChannelIdKey requester_private_channel = 3;

  EnTeamSourceType team_source_type = 4;
  google.protobuf.Any team_source_data = 5;

  string client_version = 6;
  uint64 user_router_server_id = 7;

  // 过期时间
  google.protobuf.Timestamp expired_timepoint = 8;

  // 共享的发邀请或盛情加入请求的数据，通常是状态信息的子集。
  // 数据按key-value形式下发，注意各个模块使用时key要区分开
  map<int64, DTeamAnyData> member_admission_data = 14;
}

message DTeamConfigure {
  // 各项管理操作要求的最低成员角色，保持 GUEST(0) 时使用字段注释中的默认值。
  // destroy_team 与无条件修改队长(election_captain)固定要求 EN_TEAM_MEMBER_ROLE_OWNER，不可配置。
  // 所有成员都可以删除自己(视为主动退出)和 member_update 自己的数据；
  // 所有人(包括游客)都可以同意或否决发给自己的邀请，也都可以发起加入请求。
  EnTeamPermissionRole manage_member_role = 1;         // 直接添加/删除其他成员、member_update 其他成员数据，默认 ADMIN
  EnTeamPermissionRole approve_join_request_role = 2;  // 同意/拒绝其他玩家的加入请求，默认 NORMAL
  EnTeamPermissionRole invite_role = 3;                // 发起邀请，默认 NORMAL
  EnTeamPermissionRole update_team_data_role = 4;      // 更新队伍共享数据(team_update)，默认 NORMAL
  EnTeamPermissionRole reject_invitation_role = 5;     // 否决他人收到的邀请(撤回邀请)，默认 ADMIN；
                                                       // 被邀请人本人总是可以否决发给自己的邀请
  bool disable_join_request = 6;  // 禁止非成员发起加入请求(私人小队，仅通过邀请加入)，默认 false(允许)
  EnTeamPermissionRole set_member_role_role = 7;  // 设置成员角色(member_set_role)，默认 ADMIN；
                                                  // 无论配置如何都不能授予高于操作者自身的角色
}

message DTeamStorage {
  DTeamKey team_key = 1;
  // 当前队长
  atframework.shared.DUserIDKey captain_user_key = 2;

  DTeamConfigure configure = 3;

  // 当前成员
  repeated DTeamMember member = 6;

  // 当前待处理的申请列表
  repeated DTeamJoinRequest pending_join_request = 7;

  // 当前待处理的邀请列表
  repeated DTeamInvitation pending_invitation = 8;

  // 最后收到的组队通道的消息sequence和hash code
  int64 acknowledge_action_sequence = 11;
  uint64 acknowledge_action_hash_code = 12;
  // 已保存的数据sequence，这之前的数据log可以压缩
  int64 saved_action_sequence = 13;

  // 共享的队伍数据，通常是当前关卡、模式、匹配信息等。
  // 数据按key-value形式下发，注意各个模块使用时key要区分开
  map<int64, DTeamAnyData> shared_team_data = 14;
}

message DTeamUpdateData {
  DTeamConfigure configure = 3;

  // 更新条件检查器，每个condition是或关系，内部的各项数据是与关系
  // 本字段仅作条件检查使用。如果通过，最终的Event数据会被裁剪掉
  repeated DTeamConditionChecker condition = 5;

  // 共享的队伍数据，通常是当前关卡、模式、匹配信息等。
  // 数据按key-value形式下发，注意各个模块使用时key要区分开
  map<int64, DTeamAnyData> shared_team_data = 14;
}

message DTeamAction {
  oneof action {
    // 有这个消息或者订阅失败则视为小队已解散
    DTeamKey destroy_team = 1;
    DTeamMember add_member = 2;
    DTeamMemberRemoveData remove_member = 3;
    // 队员更新共享数据(准备、取消准备、变更角色、变更装备等都可以通过修改内部 shared_member_data 来实现)
    DTeamMemberUpdateData member_update = 4;
    // 重新竞选队长
    DTeamMember election_captain = 5;
    // 更新队伍数据
    DTeamUpdateData team_update = 6;
    // 设置成员角色(需要 configure.set_member_role_role 权限，默认 ADMIN；不能授予高于操作者自身的角色)
    DTeamMemberSetRole member_set_role = 7;

    DTeamInvitation add_invitation = 21;
    DTeamInvitation approve_invitation = 22;
    DTeamInvitation reject_invitation = 23;

    DTeamJoinRequest add_join_request = 24;
    DTeamJoinRequest approve_join_request = 25;
    DTeamJoinRequest reject_join_request = 26;
  }
}

message DTeamMemberAction {
  oneof action {
    DTeamInvitation invited = 1;
    DTeamInvitation reject_invitation = 2;

    DTeamJoinRequest apply_join_request = 3;
    DTeamJoinRequest reject_join_request = 4;

    // 通知新成员已入队(接受邀请或加入请求被批准)
    DTeamMemberJoinData joined_team = 5;
    DTeamMemberRemoveData remove_member = 6;
  }
}
