syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;

import "protocol/pbdesc/com.struct.match.proto";

package atframework.shared;

option go_package = "github.com/atframework/atsf4g-co/component/public/protocol/pbdesc";

message CSMatchingStartReq {
  string battle_version = 1;
  DLevelSelect level_select = 2;
  int32 client_ds_ping = 3;
  EnMatchingFactionFillPolicy faction_fill_policy = 5;
}

message SCMatchingStartRsp {
  DLevelSelect level_parameter = 1;
  DMatchingClientView view = 2;
}

message CSMatchingCheckReq {
  // 查询当前登录玩家的权威匹配状态，不接收客户端房间标识或 matchsvr WAL 游标。
}

message SCMatchingCheckRsp {
  DMatchingClientView view = 1;
}

message CSMatchingCancelReq {
  uint64 unit_id = 2;
}

message SCMatchingCancelRsp {
  DMatchingClientView view = 1;
}

message CSMatchingConfirmReq {
  uint64 unit_id = 2;
  bool confirmed = 3;
}

message SCMatchingConfirmRsp {
  DMatchingClientView view = 1;
}

// matchsvr WAL 在 lobbysvr 合并为权威客户端视图后主动下发；客户端不感知房间或 WAL 切换。
message SCMatchingLogSync {
  DMatchingClientView client_view = 5;
}
