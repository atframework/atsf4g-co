syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;

package atframework.shared;

import "google/protobuf/timestamp.proto";
import "protocol/pbdesc/com.const.proto";

option go_package = "github.com/atframework/atsf4g-co/component/public/protocol/pbdesc";

enum EnGenderType {
  EN_GENDER_TYPE_UNKNOWN = 0;
  EN_GENDER_TYPE_MALE = 1;
  EN_GENDER_TYPE_FEMALE = 2;
}

// 登录用户终端信息
message DClientDeviceInfo {
  EnSystemID system_id = 1;   // EnSystemID
  string client_version = 2;  // 客户端版本号
  string bundle_id = 3;       // BundleId

  string operating_system = 11;  // 操作系统版本
  string device_model = 12;      // 设备机型
  string device_id = 13;         // 设备ID
  string device_name = 14;       // 设备名称

  string processor_info = 21;          // 处理器信息
  int32 processor_count = 22;          // 处理器数量
  int32 processor_frequency = 23;      // 处理器频率
  EnArchitecture processor_arch = 24;  // 处理器构架
  int32 system_memory_size = 25;       // 系统内存大小
  string graphics_info = 31;           // 显卡信息
  string graphics_vendor = 32;         // 显卡厂商
  int32 graphics_memory_size = 33;     // 显卡内存大小
  int32 graphics_shading_level = 34;   // 显卡着色器等级

  int32 screen_width = 41;   // 屏幕宽度
  int32 screen_height = 42;  // 屏幕高度
  float screen_dpi = 43;     // DPI
}

message DAppleGameCenter {
  // 一个都不能少
  string user_id = 1;              //
  string public_key_url = 2;       //
  string signature = 3;            //
  string encoded_signed_data = 4;  // 由user_id and salt and bundle_id and timestamp生成
  string salt = 5;                 //
  string bundle_id = 6;            //
  int64 timestamp = 7;             //
}

// 平台信息
message DAccountData {
  uint32 account_type = 1;  // 平台类型 EnAccountTypeID
  string access = 2;        // 授权码（内置账户的话就是密码的hash值，OAuth的话就是access token）
  uint32 channel_id = 3;  // 渠道ID（某些品太需要区分认证体系以外的渠道号） @see EnPlatformChannelID
}

message DUpdateData {
  int32 result = 1;
  int32 version = 2;
  string url = 3;
}

// 更新信息
message DClientUpdateCfg {
  int32 result = 1;    // @ENUpdateType
  string cdn_url = 2;  // 网址前缀

  DUpdateData res_data = 3;  // 资源包
  DUpdateData app_data = 4;  // app包
}

// 用户profile
message DUserProfile {
  string open_id = 1;
  uint64 user_id = 2;
  string nick_name = 3;
  string logo_url = 4;
  EnGenderType gender = 5;

  string custom_nick_name = 11;  // 用户自定义昵称
}

// 用户profile
message DUserStatistics {
  int64 register_time = 1;    // 注册时间
  int64 last_login_time = 2;  // 上次登录时间
}

// 用户数据
message DUserInformation {
  DUserProfile profile = 1;
  DUserStatistics user_statistics = 2;
}

// 用户自定义选项
message DUserOptions {}

message DUserIDKey {
  uint64 user_id = 1;
  uint32 zone_id = 2;
}

message DUserAccountIDRefer {
  uint64 user_id = 1;
  uint32 zone_id = 2;
  // uint64 account_id = 3;
}

// 用户公开选项
message DUserSharedOptions {}

// 用户私有选项
message DUserPrivateOptions {
  // 客户端自定义选项数据，长度受 Const.xlsx 的 user_options_max_size 选项限制
  bytes client_options = 1;
}

