syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;

option go_package = "github.com/atframework/atsf4g-co/component/public/protocol/pbdesc";

import "protocol/common/com.struct.dtmq.common.proto";
import "protocol/pbdesc/com.struct.chat.proto";
import "protocol/pbdesc/com.struct.dtmq.proto";

package atframework.chat;

message CSChatGetAllChannelReq {}

message SCChatGetAllChannelRsp {
  // 此接口仅返回频道的meta信息，实际开始接收数据要在下面对每个频道发送 CSChatGetChannelSnapshotReq 拉取初始快照后
  repeated DChatChannelMeta channel_metadata = 1;
}

message CSChatGetChannelSnapshotReq {
  // 拉取初始快照后才会开始收到推送消息
  string channel_id = 1;
}

message SCChatGetChannelSnapshotRsp {
  DChatChannelData channel_snapshot = 1;
}

message CSChatChannelHeartbeatReq {
  repeated atframework.dtmq.DChannelSyncPoint heartbeat_data = 1;
}

message SCChatChannelHeartbeatRsp {}

message SCChatChannelSync {
  repeated DChatChannelData chat_channel = 1;
}

message CSChatSendMessageReq {
  DChatChannelKey channel_key = 1;
  atframework.dtmq.DChannelMessageDetail detail = 2;
}

message SCChatSendMessageRsp {}
