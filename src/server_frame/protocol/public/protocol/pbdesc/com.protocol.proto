syntax = "proto3";
// 前后台通信协议定义

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;
option cc_generic_services = true;

import "google/protobuf/empty.proto";
import "protocol/extension/atframework.proto";

import "protocol/pbdesc/com.const.proto";
import "protocol/pbdesc/com.struct.proto";
import "protocol/pbdesc/com.protocol.rank.proto";
import "protocol/pbdesc/com.protocol.cache.proto";
import "protocol/pbdesc/com.protocol.chat.proto";
import "protocol/common/com.struct.item.common.proto";

option go_package = "github.com/atframework/atsf4g-co/component/public/protocol/pbdesc";

package hello;

/////////////////////////////////////////////////////
// 到loginsvr的CS协议
/////////////////////////////////////////////////////

message CSLoginUpdateReq {
  DAccountData account = 1;      // 平台信息
  EnSystemID system_id = 2;      // 系统id，ios or android
  string package_version = 11;   // 包版本
  string resource_version = 12;  // 资源版本
  string protocol_version = 13;  // 协议版本
}

message SCLoginUpdateRsp {
  DClientUpdateCfg update_info = 1;  // 更新信息
  int32 version_type = 2;            // 版本类型 @EnVersionType
}

message CSLoginAuthReq {
  string open_id = 1;
  DAccountData account = 2;      // 平台信息
  EnSystemID system_id = 3;      // 系统id，ios or android
  string package_version = 11;   // 包版本
  string resource_version = 12;  // 资源版本
  string protocol_version = 13;  // 协议版本

  DClientDeviceInfo client_info = 21;
}

message SCLoginAuthRsp {
  string access_token_code = 11;  // 认证码

  DClientUpdateCfg update_info = 3;  // 更新信息
  uint32 version_type = 4;           // 版本类型 @EnVersionType

  string open_id = 21;  // 最终open_id
  uint64 user_id = 22;  // 玩家数字ID

  int64 ban_time = 101;    // 封号期限
  int64 start_time = 102;  // 开服时间
}

// 修改密码
message CSAccessUpdateReq {
  string open_id = 1;
  uint64 user_id = 2;     // 玩家数字ID
  string old_access = 3;  // 老密码
  string new_access = 4;
}

message SCAccessUpdateRsp {}

////////////////////////////////////////////////////////
// 到gamesvr的CS协议
////////////////////////////////////////////////////////

// 登录请求
message CSLoginReq {
  string access_token_code = 1;  // 认证码
  string open_id = 2;
  uint64 user_id = 3;  // 玩家数字ID
  uint32 zone_id = 4;   // 大区ID

  DAccountData account = 5;  // 平台信息
  DClientDeviceInfo client_info = 11;
}

// 登录返回
message SCLoginRsp {
  int32 last_sequence = 1;       // 上次收包的seq(不算MCSLogin)
  int64 heartbeat_interval = 2;  // 心跳包间隔
  bool is_new_player = 3;        // 是否是新玩家
  int32 version_type = 4;        // 版本类型 @EnVersionType
  uint32 zone_id = 5;             // 大区ID
}

message SCPlayerProfileSyn {
  DUserProfile player = 1;
}

// 脏数据同步包
message SCPlayerDirtyChgSync {
  repeated DItemInstance dirty_items = 1;
}

// 心跳包，上行包
message CSPingReq {}

// 心跳包，下行包
message SCPongRsp {}

// 请求用户数据
message CSPlayerGetInfoReq {
  bool need_user_information = 1;  // 标记为true 回包才有会有玩家基本数据
  bool need_user_options = 2;      // 标记为true 回包才有会有玩家选项数据
}

// 用户数据返回
message SCPlayerGetInfoRsp {
  DUserInformation user_information = 1;  // 玩家数据
  DUserOptions user_options = 2;          // 玩家自定义选项
}

service AuthsvrClientService {
  rpc login_auth(CSLoginAuthReq) returns (SCLoginAuthRsp) {
    option (atframework.rpc_options) = {
      api_name: "Authorization"
    };
  };
}

service LobbysvrClientService {
  rpc login(CSLoginReq) returns (SCLoginRsp) {
    option (atframework.rpc_options) = {
      api_name: "Login"
    };
  };

  rpc ping(CSPingReq) returns (SCPongRsp) {
    option (atframework.rpc_options) = {
      api_name: "Ping/pong"
    };
  };

  rpc access_update(CSAccessUpdateReq) returns (SCAccessUpdateRsp) {
    option (atframework.rpc_options) = {
      api_name: "Update access token"
    };
  };

  rpc player_get_info(CSPlayerGetInfoReq) returns (SCPlayerGetInfoRsp) {
    option (atframework.rpc_options) = {
      module_name: "player"
      api_name: "Get player data"
    };
  };

  // Use stream request to disable waiting for response
  rpc player_dirty_chg_sync(google.protobuf.Empty) returns (stream SCPlayerDirtyChgSync) {
    option (atframework.rpc_options) = {
      module_name: "player"
      api_name: "Push dirty data"
    };
  };

  // ================ 排行榜RPC ================
  rpc rank_get_specify_rank(CSRankGetSpecifyRankReq) returns (SCRankGetSpecifyRankRsp) {
    option (atframework.rpc_options) = {
      module_name: "rank"
      api_name: "获取指定排名范围的排行榜"
    };
  };

  rpc rank_get_self_rank(CSRankGetSelfRankReq) returns (SCRankGetSelfRankRsp) {
    option (atframework.rpc_options) = {
      module_name: "rank"
      api_name: "获取排行榜中自身及前后排名"
    };
  };

  rpc rank_cache_expired_sync(google.protobuf.Empty) returns (stream SCRankCacheExpiredSync) {
    option (atframework.rpc_options) = {
      module_name: "rank"
      api_name: "排行榜缓存失效通知"
    };
  };

  // ================ CACHE RPC =================
  // 批量拉取数据（并订阅）
  rpc cache_api_batch_get(CSCacheApiBatchGetReq) returns (SCCacheApiBatchGetRsp) {
    option (atframework.rpc_options) = {
      module_name: "cache"
      api_name: "批量拉取数据（并订阅）"
      frequency_limit: { frequency_limit_ms: 10000 frequency_limit_count: 100 }
    };
  };

  // 反订阅
  rpc cache_api_unwatch(CSCacheApiUnwatchReq) returns (SCCacheApiUnwatchRsp) {
    option (atframework.rpc_options) = {
      module_name: "cache"
      api_name: "反订阅"
      frequency_limit: { frequency_limit_ms: 5000 frequency_limit_count: 30 }
    };
  };

  // 指定缓存数据失效通知
  rpc cache_api_expired(google.protobuf.Empty) returns (stream SCCacheApiExpiredSync) {
    option (atframework.rpc_options) = {
      module_name: "cache"
      api_name: "指定缓存数据失效通知"
      no_cache: true
    };
  };

  // Meta信息更新(缓存数据的简化版本)通知
  rpc cache_api_update_meta(google.protobuf.Empty) returns (stream SCCacheApiUpdateMetaSync) {
    option (atframework.rpc_options) = {
      module_name: "cache"
      api_name: "Meta信息更新(缓存数据的简化版本)通知"
      no_cache: true
    };
  };

  // 全部缓存数据失效通知
  rpc cache_api_all_expired(google.protobuf.Empty) returns (stream SCCacheApiAllExpiredSync) {
    option (atframework.rpc_options) = {
      module_name: "cache"
      api_name: "全部缓存数据失效通知"
      no_cache: true
    };
  };

  // 主动通知服务器更新meta
  rpc cache_api_notify_meta(CSCacheApiNotifyMetaReq) returns (SCCacheApiNotifyMetaRsp) {
    option (atframework.rpc_options) = {
      module_name: "cache"
      api_name: "主动通知服务器更新meta"
      frequency_limit: { frequency_limit_ms: 5000 frequency_limit_count: 30 }
    };
  };

  // ================ 聊天RPC ================
  rpc chat_get_all_channel(atframework.chat.CSChatGetAllChannelReq) returns (atframework.chat.SCChatGetAllChannelRsp) {
    option (atframework.rpc_options) = {
      module_name: "chat"
      api_name: "获取所有聊天频道"
    };
  };

  rpc chat_get_channel_snapshot(atframework.chat.CSChatGetChannelSnapshotReq) returns (atframework.chat.SCChatGetChannelSnapshotRsp) {
    option (atframework.rpc_options) = {
      module_name: "chat"
      api_name: "获取聊天频道快照"
    };
  };

  rpc chat_channel_heartbeat(atframework.chat.CSChatChannelHeartbeatReq) returns (atframework.chat.SCChatChannelHeartbeatRsp) {
    option (atframework.rpc_options) = {
      module_name: "chat"
      api_name: "聊天频道心跳"
    };
  };

  rpc chat_channel_sync(google.protobuf.Empty) returns (stream atframework.chat.SCChatChannelSync) {
    option (atframework.rpc_options) = {
      module_name: "chat"
      api_name: "聊天频道推送同步"
    };
  };

  rpc chat_channel_unsubscribe(atframework.chat.CSChatChannelUnsubscribeReq) returns (atframework.chat.SCChatChannelUnsubscribeRsp) {
    option (atframework.rpc_options) = {
      module_name: "chat"
      api_name: "聊天频道退订"
    };
  };

  rpc chat_send_message(atframework.chat.CSChatSendMessageReq) returns (atframework.chat.SCChatSendMessageRsp) {
    option (atframework.rpc_options) = {
      module_name: "chat"
      api_name: "发送聊天消息"
    };
  };
}
