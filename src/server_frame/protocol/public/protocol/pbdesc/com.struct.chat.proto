syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

import "protocol/common/com.struct.dtmq.common.proto";
import "protocol/pbdesc/com.struct.proto";

option go_package = "github.com/atframework/atsf4g-co/component/public/protocol/pbdesc";

package atframework.chat;

// 注意和DtMq.xlsx 表对应，多个模块之间类型不要冲突
enum EnChatChannelType {
  EN_CHAT_CHANNEL_TYPE_INVALID = 0;
  EN_CHAT_CHANNEL_TYPE_PUBLIC = 1;            // 公共频道 Channel
  EN_CHAT_CHANNEL_TYPE_PRIVATE = 2;           // 私聊用户 Channel
  EN_CHAT_CHANNEL_TYPE_SYS_NOTIFICATION = 3;  // 系统通知 Channel(生命周期短)
  EN_CHAT_CHANNEL_TYPE_SYS_ANNOUNCEMENT = 4;  // 系统公告 Channel(生命周期长)
}
