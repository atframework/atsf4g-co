syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;

import "protocol/extension/xrescode_extensions_v3.proto";
import "protocol/extension/v3/xresloader.proto";

import "protocol/common/com.struct.item.common.proto";

option go_package = "github.com/atframework/atsf4g-co/component/public/protocol/config";

package atframework.shared.config;

enum EnMatchingRuleType {
  EN_MATCHING_RULE_NONE = 0;
  EN_MATCHING_RULE_RANK_DIFF = 1 [(org.xresloader.enum_alias) = "段位"];            // 段位差异
  EN_MATCHING_RULE_ROLE_LEVEL_DIFF = 2 [(org.xresloader.enum_alias) = "角色等级"];  // 等级差异
}

enum EnMatchingParameterMergeType {
  EN_MATCHING_PARAMETER_MERGE_NONE = 0;
  EN_MATCHING_PARAMETER_MERGE_MAX = 1 [(org.xresloader.enum_alias) = "最大值"];
  EN_MATCHING_PARAMETER_MERGE_MIN = 2 [(org.xresloader.enum_alias) = "最小值"];
  EN_MATCHING_PARAMETER_MERGE_AVERAGE = 3 [(org.xresloader.enum_alias) = "平均值"];
  EN_MATCHING_PARAMETER_MERGE_SUM = 4 [(org.xresloader.enum_alias) = "求和"];
  EN_MATCHING_PARAMETER_MERGE_CAPTAIN = 5 [(org.xresloader.enum_alias) = "队长"];
  EN_MATCHING_PARAMETER_MERGE_ANY = 6 [(org.xresloader.enum_alias) = "任一"];
  EN_MATCHING_PARAMETER_MERGE_ALL = 7 [(org.xresloader.enum_alias) = "全部"];
}

enum EnMatchingFactionAddRule {
  EN_MATCHING_FACTION_ADD_RULE_NONE = 0;
  EN_MATCHING_FACTION_ADD_RULE_SAME_AS_TEAM = 1 [(org.xresloader.enum_alias) = "队伍匹配人数"];
}

enum EnMatchingFactionFillPolicy {
  EN_MATCHING_FACTION_FILL_NONE = 0;
  EN_MATCHING_FACTION_FILL_BALANCED = 1 [(org.xresloader.enum_alias) = "平均"];
  EN_MATCHING_FACTION_FILL_PRIORITY = 2 [(org.xresloader.enum_alias) = "优先"];
}

message DMatchingRuleItem {
  EnMatchingRuleType type = 1;
  repeated int32 values = 2 [(org.xresloader.field_separator) = ","];
}

message DMatchingForceLimit {
  int32 force_type = 1;
  int32 count = 2;
}

// 匹配池负责容量和规则组选择；配置由 server_frame 的 config_manager 统一持有。
message ExcelMatchingPool {
  option (xrescode.loader) = {
    file_path: "matching_pool.bytes"
    indexes: { fields: "id" index_type: EN_INDEX_KV }
    tags: "server"
  };

  int32 id = 1 [(org.xresloader.field_unique_tag) = "id"];
  int32 max_user_cout_limit = 2;
  int32 max_faction_cout_limit = 3;
  // 单个不可拆分 Unit 的最大玩家数。
  int32 unit_max_size = 4;
  // 单个 faction 的最大玩家数；允许撮合队友的 faction 固定以此作为容量，并须补满。
  int32 faction_user_max_size = 5;
  repeated int32 rule_group_ids = 6 [(org.xresloader.field_separator) = ","];
  int32 search_timeout_seconds = 7;
  int32 confirm_timeout_seconds = 8;
  EnMatchingFactionFillPolicy faction_fill_policy = 9;
}

// 根据全服匹配人数选择一个规则组，再按房间等待时间选择组内规则。
message ExcelMatchingRuleGroup {
  option (xrescode.loader) = {
    file_path: "matching_rule_group.bytes"
    indexes: { fields: "group_id" index_type: EN_INDEX_KV }
    tags: "server"
  };

  int32 group_id = 1 [(org.xresloader.field_unique_tag) = "group_id"];
  int32 global_user_lower = 2;
  int32 global_user_upper = 3;
  repeated int32 pool_rules = 4 [(org.xresloader.field_separator) = ","];
}

message ExcelMatchingRule {
  option (xrescode.loader) = {
    file_path: "matching_rule.bytes"
    indexes: { fields: "id" index_type: EN_INDEX_KV }
    tags: "server"
  };

  message TimeLimit {
    int32 min = 1;
    int32 max = 2;
  }

  int32 id = 1 [(org.xresloader.field_unique_tag) = "id"];
  TimeLimit time_limit = 2;
  repeated DMatchingRuleItem rules = 3;
  int32 min_user_cout_limit = 6;
  repeated DMatchingForceLimit force_type_limits = 7 [(org.xresloader.field_separator) = ","];
  int32 min_faction_count_limit = 8;
  repeated string region_limits = 9 [(org.xresloader.field_separator) = ","];
  // NONE 不限制阵营容量之间的关系；SAME_AS_TEAM 要求加入的目标容量等于房间最大阵营容量。
  EnMatchingFactionAddRule faction_add_rule = 10;
}

message ExcelMatchingParameterMergeRuleTemplate {
  option (xrescode.loader) = {
    file_path: "matching_parameter_merge_rule_template.bytes"
    indexes: { fields: "rule_type" index_type: EN_INDEX_KV }
    tags: "server"
  };

  EnMatchingRuleType rule_type = 1 [(org.xresloader.field_unique_tag) = "rule_type"];
  EnMatchingParameterMergeType merge_type = 2;
}
