syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;

import "protocol/extension/xrescode_extensions_v3.proto";
import "protocol/extension/v3/xresloader.proto";

import "protocol/common/com.struct.dtmq.common.proto";

option go_package = "github.com/atframework/atsf4g-co/component/public/protocol/config";

package atframework.shared.config;

// 聊天频道配置
message ExcelDtmqChannelType {
  option (xrescode.loader) = {
    file_path: "dtmq_channel_type.bytes"
    indexes: { fields: "channel_type" index_type: EN_INDEX_KV }

    tags: "client"
    tags: "server"
  };

  uint32 channel_type = 1 [(org.xresloader.field_unique_tag) = "channel_type"];

  atframework.dtmq.DChannelConfigure channel_configure = 2;
  uint32 show_max_log_count = 5;        // 客户端展示消息条数
  uint32 readonly_replicate_count = 6;  // 只读副本数量
}
