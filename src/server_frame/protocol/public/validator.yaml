validator:
  # com.struct.item.config.proto
  - name: "ExcelItemType_type_id"
    description: "Item.xlsx|道具描述总表|type_id 值校验"
    rules:
      - InTableColumn("Item.xlsx", "道具描述总表", 3, 2, "type_id")
  - name: "UESourceInventory_type_id"
    description: "UE局内 UESourceInventory 资源值校验"
    rules:
      - InText("UeSource_Inventory.txt", 1)
  - name: "ExcelTradeValidPrice_id"
    description: "TradeMarket.xlsx|ValidPrice|id 值校验"
    rules:
      - InTableColumn("TradeMarket.xlsx", "ValidPrice", 3, 2, "id")
  - name: "ExcelTradeStandardPrice_id"
    description: "TradeMarket.xlsx|StandardPrice|id 值校验"
    rules:
      - InTableColumn("TradeMarket.xlsx", "StandardPrice", 3, 2, "id")
  - name: "ExcelTradeRecommend_id"
    description: "TradeMarket.xlsx|商品推荐规则表|id 值校验"
    rules:
      - InTableColumn("TradeMarket.xlsx", "TradeAuctionRecommend", 3, 2, "group_id")
      - InTableColumn("TradeMarket.xlsx", "TradeHomogeneousRecommend", 3, 2, "group_id")
  - name: "ExcelTradeMarket_id"
    description: "TradeMarket.xlsx|MarketSettings|id 值校验"
    rules:
      - InTableColumn("TradeMarket.xlsx", "MarketSettings", 4, 3, "id")
  - name: "ExcelTradeAmountCoefficient_id_group"
    description: "TradeMarket.xlsx|TradeAmountCoefficient|id_group 值校验"
    rules:
      - InTableColumn("TradeMarket.xlsx", "TradeAmountCoefficient", 3, 2, "id_group")
  - name: "ExcelTradeSellDelay_id"
    description: "TradeMarket.xlsx|SellDelay|id 值校验"
    rules:
      - InTableColumn("TradeMarket.xlsx", "SellDelay", 3, 2, "id")
  - name: "ExcelTradeValidTime_id"
    description: "TradeMarket.xlsx|ValidTime|id 值校验"
    rules:
      - InTableColumn("TradeMarket.xlsx", "ValidTime", 4, 3, "id")
