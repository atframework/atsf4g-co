syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;

option go_package = "github.com/atframework/atsf4g-go/component-protocol-private/extension/protocol/extension";

import "google/protobuf/descriptor.proto";

package atframework;

message database_partly_field {
  string name = 1;
  repeated string fields = 2;
}

message database_table_index_kv {
  bool enable_cas = 1;
  repeated database_partly_field partly_get = 2;
  repeated database_partly_field partly_save = 3;
  repeated string atomic_inc_fields = 4;
}

message database_table_index_kl {
  uint32 max_list_length = 1;
}

message database_table_index_km {
  bool enable_cas = 1;
  repeated string map_keys = 2;
}

message database_table_index {
  string name = 1;
  repeated string key_fields = 2;
  oneof index {
    database_table_index_kv kv = 11;
    database_table_index_kl kl = 12;
    database_table_index_km km = 13;
  }
}

message database_table_options {
  repeated database_table_index index = 1;
}

extend google.protobuf.MessageOptions {
  database_table_options database_table = 3311;  // 自定义数据库表配置
}
