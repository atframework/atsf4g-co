syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;
option cc_generic_services = true;

import "google/protobuf/empty.proto";
import "protocol/extension/atframework.proto";

import "protocol/pbdesc/com.struct.proto";
import "protocol/pbdesc/com.struct.match.proto";
import "protocol/pbdesc/com.struct.orbit.proto";

option go_package = "github.com/atframework/atsf4g-co/lobbysvr/protocol/protocol/pbdesc";
package atframework.shared;

// WAL 订阅者的路由信息，由所属 Unit 持有。
message DMatchingSubscriberData {
  uint64 server_id = 1;
  int64 last_send_event_id = 2;
  int64 valid_event_id_bound = 3;
  int64 acknowledge_event_id = 4;
  // Matchsvr 接收该玩家最近一次 Unit 心跳时间
  int64 last_heartbeat_time = 5;
}

message DMatchingSubscriberRoute {
  DUserIDKey user_key = 1;
  uint64 server_id = 2;
}

// matchsvr 主动发给 lobbysvr 的 Unit 增量日志和当前视图。
message SSMatchingEventSync {
  uint64 unit_id = 1;
  repeated DUserIDKey user_keys = 2;
  repeated DMatchingUnitEventLog event_logs = 3;
  DMatchingUnitView unit_view = 8;
}

message SSMatchingCreateReq {
  DMatchingScope scope = 1;         // 匹配桶
  DMatchingUnit unit = 2;           // 参与匹配的单位信息
  DUserIDKey operator_user = 3;     // 本次实际操作者
  repeated DMatchingSubscriberRoute subscriber_routes = 4;  // 必须且只覆盖 unit 中的全部用户
}

message SSMatchingCancelReq {
  uint64 unit_id = 1;
  DUserIDKey operator_user = 2;
}

message SSMatchingConfirmReq {
  uint64 unit_id = 1;
  DUserIDKey operator_user = 2;
  bool confirmed = 3;
  uint64 subscriber_server_id = 4;
  int64 acknowledge_event_id = 5;
  string user_open_id = 6; // 用户的 openid_id，lobbysvr 需要在确认战斗时传入
  DOrbitUserInitDataDetail orbit_init_data = 7; // 保底的战斗房间初始化数据，确保玩家会进入到局内
}

message SSMatchingSnapshot {
  int32 result = 1;
  DMatchingUnitView snapshot = 2;
  // matchsvr 内部诊断和测试定位字段；lobbysvr 不持久化、不回传客户端，也不用于后续操作。
  string matching_id = 3;
}

message DMatchingUserHeartbeat {
  DUserIDKey user_key = 1;
  // 该玩家已经完成业务副作用的最大连续 Unit WAL 事件。
  int64 acknowledge_event_id = 2;
}

// Unit 心跳同时承担权威状态查询、订阅路由刷新和 WAL 业务确认。
message SSMatchingCheckReq {
  uint64 unit_id = 1;
  uint64 subscriber_server_id = 2;
  // 当前 Lobby 实际持有的一个 Unit 玩家；同一 Unit 的其他玩家可以位于其他 Lobby。
  DMatchingUserHeartbeat heartbeat_data = 3;
}

service MatchsvrService {
  option (atframework.service_options) = { module_name: "matching" };

  rpc create_matching(SSMatchingCreateReq) returns (SSMatchingSnapshot) {
    option (atframework.rpc_options) = { api_name: "创建或加入匹配" };
  };
  rpc cancel_matching(SSMatchingCancelReq) returns (SSMatchingSnapshot) {
    option (atframework.rpc_options) = { api_name: "取消匹配" };
  };
  rpc matching_heart_bear(SSMatchingCheckReq) returns (SSMatchingSnapshot) {
    option (atframework.rpc_options) = {
      api_name: "匹配心跳"
      descriptions: "query authoritative Unit state, acknowledge completed WAL events and trigger replay"
    };
  };
  rpc confirm_matching(SSMatchingConfirmReq) returns (SSMatchingSnapshot) {
    option (atframework.rpc_options) = { api_name: "确认或拒绝战斗" };
  };
}

// 发送端和接收端共用同一份 SDK；lobbysvr 只生成接收处理器。
service MatchsvrNotifyService {
  option (atframework.service_options) = { module_name: "matching" };

  rpc matching_event_sync(stream SSMatchingEventSync) returns (google.protobuf.Empty) {
    option (atframework.rpc_options) = {
      api_name: "匹配 WAL 事件通知"
      descriptions: "notify lobbysvr to sync matching events"
      allow_no_wait: true
    };
  };
}
