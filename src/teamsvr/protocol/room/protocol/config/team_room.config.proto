syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;
option cc_generic_services = true;

import "atframe/atapp_conf.proto";

option go_package = "github.com/atframework/atsf4g-co/src/service-teamsvr/protocol/room/protocol/config";

package atframework.team.config;

message teamsvr_room_cfg {
  // 主控节点定期压缩 dtmq 日志的时间间隔(秒)，日志数量达到频道配置 gc_log_count 时也会触发
  int64 compact_interval_sec = 1 [(atframework.atapp.protocol.CONFIGURE) = { default_value: "60" min_value: "5" }];
  // 成员离线过期时长(秒)，超过此时长未心跳的成员会被移出队伍
  int64 member_offline_expire_sec = 2 [(atframework.atapp.protocol.CONFIGURE) = { default_value: "300" min_value: "30" }];
  // 空队伍保留时长(秒)，所有成员退出后保留一段时间再销毁频道
  int64 empty_room_destroy_delay_sec = 3 [(atframework.atapp.protocol.CONFIGURE) = { default_value: "30" min_value: "0" }];
  // 加入请求默认有效期(秒)，外部请求未带过期时间时使用
  int64 join_request_expire_sec = 4 [(atframework.atapp.protocol.CONFIGURE) = { default_value: "60" min_value: "5" }];
  // 加入邀请默认有效期(秒)，外部请求未带过期时间时使用
  int64 invitation_expire_sec = 5 [(atframework.atapp.protocol.CONFIGURE) = { default_value: "60" min_value: "5" }];
}
