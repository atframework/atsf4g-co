syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;
option cc_generic_services = true;

import "google/protobuf/timestamp.proto";

import "protocol/extension/atframework.proto";
import "protocol/common/com.struct.dtmq.common.proto";
import "protocol/pbdesc/com.struct.proto";
import "protocol/pbdesc/com.struct.team.proto";

option go_package = "github.com/atframework/atsf4g-co/service-teamsvr/protocol/room/protocol/pbdesc";

package atframework.team;

message SSTeamRoomCreateReq {
  DTeamKey team_key = 1;
  atframework.shared.DUserIDKey sender_user_key = 2;
  atframework.dtmq.DChannelIdKey sender_user_channel = 3;

  DTeamConfigure configure = 4;

  // 共享的成员数据，通常是阵容信息、状态信息等。
  // 数据按key-value形式下发，注意各个模块使用时key要区分开
  map<int32, DTeamAnyData> shared_member_data = 13;

  // 共享的队伍数据，通常是当前关卡、模式、匹配信息等。
  // 数据按key-value形式下发，注意各个模块使用时key要区分开
  map<int32, DTeamAnyData> shared_team_data = 14;
}

message SSTeamRoomCreateRsp {
  int32 client_result = 1;
  DTeamKey team_key = 2;
}

message SSTeamRoomSendMessageReq {
  DTeamKey team_key = 1;
  atframework.shared.DUserIDKey sender_user_key = 2;
  DTeamAction action = 3;
}

message SSTeamRoomSendMessageRsp {
  int32 client_result = 1;
}

message SSTeamRoomHeartbeatReq {
  DTeamKey team_key = 1;
  atframework.shared.DUserIDKey user_key = 2;
  uint64 user_router_server_id = 3;
  int64 sequence = 4;
  uint64 hash_code = 6;
}

message SSTeamRoomHeartbeatRsp {
  int32 client_result = 1;
}

// 成员运行时的私有数据，仅随 dtmq private_data 在主控节点间同步，不下发给队伍成员
message DTeamRoomMemberRuntimeData {
  DTeamMember public_member_data = 1;

  // 成员最近一次心跳上报的路由服务ID
  uint64 user_router_server_id = 3;
}

// 队伍管理用的私有数据，仅随 dtmq private_data 在主控节点间同步，不下发给队伍成员
message DTeamRoomPrivateData {
  DTeamKey team_key = 1;

  // 队伍是否已经完成过创建；成员清空后仍保持为 true，防止旧 team_id 被重新接管。
  bool team_created = 10;

  // 上次压缩完成时的sequence和时间点
  int64 last_compact_sequence = 11;
  google.protobuf.Timestamp last_compact_timepoint = 12;

  // 共享的队伍数据，通常是当前关卡、模式、匹配信息等。
  // 数据按key-value形式下发，注意各个模块使用时key要区分开
  map<int32, DTeamAnyData> private_team_data = 15;
}

message SSTeamRoomAddInvitationReq {
  DTeamInvitation invitation = 1;
  atframework.shared.DUserIDKey sender_user_key = 2;
}

message SSTeamRoomAddInvitationRsp {
  int32 client_result = 1;
}

message SSTeamRoomApproveInvitationReq {
  DTeamKey team_key = 1;
  atframework.shared.DUserIDKey sender_user_key = 2;
  atframework.shared.DUserIDKey invitee = 3;

  string client_version = 6;
  uint64 user_router_server_id = 7;

  // 共享的成员数据，通常是阵容信息、状态信息等。
  // 数据按key-value形式下发，注意各个模块使用时key要区分开
  map<int32, DTeamAnyData> shared_member_data = 13;
}

message SSTeamRoomApproveInvitationRsp {
  int32 client_result = 1;
}

message SSTeamRoomRejectInvitationReq {
  DTeamKey team_key = 1;
  atframework.shared.DUserIDKey sender_user_key = 2;
  atframework.shared.DUserIDKey invitee = 3;
}

message SSTeamRoomRejectInvitationRsp {
  int32 client_result = 1;
}

message SSTeamRoomAddJoinRequestReq {
  DTeamJoinRequest join_request = 1;
  atframework.shared.DUserIDKey sender_user_key = 2;
}

message SSTeamRoomAddJoinRequestRsp {
  int32 client_result = 1;
}

message SSTeamRoomApproveJoinRequestReq {
  DTeamKey team_key = 1;
  atframework.shared.DUserIDKey sender_user_key = 2;
  atframework.shared.DUserIDKey applicant = 3;
}

message SSTeamRoomApproveJoinRequestRsp {
  int32 client_result = 1;
}

message SSTeamRoomRejectJoinRequestReq {
  DTeamKey team_key = 1;
  atframework.shared.DUserIDKey sender_user_key = 2;
  atframework.shared.DUserIDKey applicant = 3;
}

message SSTeamRoomRejectJoinRequestRsp {
  int32 client_result = 1;
}

service TeamRoomService {
  option (atframework.service_options) = {
    module_name: "team"
  };

  rpc create(SSTeamRoomCreateReq) returns (SSTeamRoomCreateRsp) {
    option (atframework.rpc_options) = {
      api_name: "创建队伍"
      allow_no_wait: true
    };
  };

  rpc send_message(SSTeamRoomSendMessageReq) returns (SSTeamRoomSendMessageRsp) {
    option (atframework.rpc_options) = {
      api_name: "发送消息"
      allow_no_wait: true
    };
  };

  rpc heartbeat(SSTeamRoomHeartbeatReq) returns (SSTeamRoomHeartbeatRsp) {
    option (atframework.rpc_options) = {
      api_name: "成员心跳"
      allow_no_wait: true
    };
  }

  rpc add_join_request(SSTeamRoomAddJoinRequestReq) returns (SSTeamRoomAddJoinRequestRsp) {
    option (atframework.rpc_options) = {
      api_name: "添加加入请求"
      allow_no_wait: true
    };
  }

  rpc approve_join_request(SSTeamRoomApproveJoinRequestReq) returns (SSTeamRoomApproveJoinRequestRsp) {
    option (atframework.rpc_options) = {
      api_name: "批准加入请求"
      allow_no_wait: true
    };
  }

  rpc reject_join_request(SSTeamRoomRejectJoinRequestReq) returns (SSTeamRoomRejectJoinRequestRsp) {
    option (atframework.rpc_options) = {
      api_name: "拒绝加入请求"
      allow_no_wait: true
    };
  }

  rpc add_invitation(SSTeamRoomAddInvitationReq) returns (SSTeamRoomAddInvitationRsp) {
    option (atframework.rpc_options) = {
      api_name: "添加邀请"
      allow_no_wait: true
    };
  }

  rpc approve_invitation(SSTeamRoomApproveInvitationReq) returns (SSTeamRoomApproveInvitationRsp) {
    option (atframework.rpc_options) = {
      api_name: "批准邀请"
      allow_no_wait: true
    };
  }

  rpc reject_invitation(SSTeamRoomRejectInvitationReq) returns (SSTeamRoomRejectInvitationRsp) {
    option (atframework.rpc_options) = {
      api_name: "拒绝邀请"
      allow_no_wait: true
    };
  }
}
