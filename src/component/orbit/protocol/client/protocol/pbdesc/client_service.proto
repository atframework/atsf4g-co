syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;
option cc_generic_services = true;

import "google/protobuf/empty.proto";
import "protocol/extension/atframework.proto";

package atframework.orbit;

import "protocol/common/orbit.common.proto";

/////////////// Agent -> Client ///////////////
service AgentToClientService {
  rpc start_client(ATDStartClientReq) returns (DTAStartClientRsp) {
    option (atframework.rpc_options) = {
      api_name: "开始Client"
    };
  }
  rpc forward_to_client(ATDForwardToClientReq) returns (DTAForwardToClientRsp) {
    option (atframework.rpc_options) = {
      api_name: "转发Server消息"
    };
  };
  rpc fork_seed_client(ATDForkSeedClientReq) returns (DTAForkSeedClientRsp) {
    option (atframework.rpc_options) = {
      api_name: "Fork方式启动Client"
    };
  };
  rpc stop_client(stream ATDStopClientReq) returns (google.protobuf.Empty) {
    option (atframework.rpc_options) = {
      api_name: "停止Client"
    };
  };
}

message ATDStartClientReq {
  // 真实 client_id。为空表示沿用拉起时下发的 Client 通信标识
  DClientId client_id = 1;
}
message DTAStartClientRsp {
  int32 error_code = 1;
}

message ATDForwardToClientReq {
  bytes payload = 1;
}
message DTAForwardToClientRsp {
  int32 error_code = 1;
}

message ATDForkSeedClientReq {
  uint64 app_id = 1;
  DClientStartArgs start_args = 2;
}
message DTAForkSeedClientRsp {
  int32 error_code = 1;
  int32 pid = 2;
}

message ATDStopClientReq {
  EnClientExitReason reason = 1;
}

/////////////// Client -> Agent ///////////////
service ClientToAgentService {
  // 上报 Client 心跳
  rpc client_heartbeat(DTAClientHeartbeatReq) returns (ATDClientHeartbeatRsp) {
    option (atframework.rpc_options) = {
      api_name: "上报心跳"
    };
  };
  // 发送自定义消息
  rpc send_to_server(DTASendToServerReq) returns (ATDSendToServerRsp) {
    option (atframework.rpc_options) = {
      api_name: "发送至Server"
      allow_no_wait: true
    };
  };
  // 上报 Client 状态
  rpc client_start(DTAClientStartReq) returns (ATDClientStartRsp) {
    option (atframework.rpc_options) = {
      api_name: "Client启动成功"
    };
  };
  rpc client_exit(DTAClientExitReq) returns (ATDClientExitRsp) {
    option (atframework.rpc_options) = {
      api_name: "Client退出"
    };
  };
}

// Client 通信标识。Agent 拉起进程时分配，进程存活期内不变；
// 只在本文件（Agent 与 Client 之间）使用，不进入 Server / Controller 协议
message DClientInstanceId {
  uint64 instance_id = 1;
}

message DTAClientHeartbeatReq {
  DClientInstanceId client_instance_id = 1;
  DClientLoadSnapshot snapshot = 2;
}
message ATDClientHeartbeatRsp {
  int32 error_code = 1;
  // Agent 实例唯一标识。Client 用于判断自己是否还属于当前 Agent 实例
  string agent_instance_id = 2;
  // Client 已被认领时回填真实 client_id
  DClientId client_id = 3;
}

message DTASendToServerReq {
  DClientInstanceId client_instance_id = 1;
  bytes payload = 2;
}
message ATDSendToServerRsp {
  int32 error_code = 1;
}

message DTAClientStartReq {
  DClientInstanceId client_instance_id = 1;
  string client_ip = 2;
  int32 client_port = 3;
  bytes custom_data = 4;
}
message ATDClientStartRsp {
  int32 error_code = 1;
}

message DTAClientExitReq {
  DClientInstanceId client_instance_id = 1;

  EnClientExitReason exit_reason = 11;
  bytes custom_data = 12;
  int32 exit_code = 13;
}
message ATDClientExitRsp {
  int32 error_code = 1;
}