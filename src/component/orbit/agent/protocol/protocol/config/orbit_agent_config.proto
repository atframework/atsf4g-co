syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;

package orbit.config;

message orbit_agent_cfg {
  string region = 1;
  string tag = 2;
  double cpu_capacity = 4;
  double memory_capacity_mb = 5;
  uint32 server_identity_timeout_sec = 6;
  uint32 server_identity_check_interval_sec = 7;
  int32 max_batch_startup_count = 8;
  string client_ip = 9;
  int32 repeated_startup_failures_fatal_error = 10;
  bool enable_pre_start = 11;

  string remote_agent_addr = 12;
  string local_agent_addr = 13;
  // 未认领的预启动进程连续启动失败达到该次数后，停止该模板的预启动；0 表示不限制
  uint32 pre_start_repeated_failures_limit = 14;

  string client_path = 31;
  string client_command_line = 32;
  string log_name = 33;

  bool enable_seed_mode = 40;
}
