syntax = "proto3";

option optimize_for = SPEED;
// option optimize_for = LITE_RUNTIME;
// option optimize_for = CODE_SIZE;
// --cpp_out=lite:,--cpp_out=
option cc_enable_arenas = true;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

import "atframe/atapp_conf.proto";

option go_package = "github.com/atframework/atsf4g-co/service-authsvr/protocol/protocol/config";

package atframework.shared.config;

enum authsvr_router_policy {
  EN_AUTHSVR_ROUTER_POLICY_RANDOM = 0 [(atframework.atapp.protocol.ENUMVALUE) = { alias_name: "random" }];
  EN_AUTHSVR_ROUTER_POLICY_ROUND_ROBIN = 1 [(atframework.atapp.protocol.ENUMVALUE) = { alias_name: "round_robin" }];
  EN_AUTHSVR_ROUTER_POLICY_HASH = 2 [(atframework.atapp.protocol.ENUMVALUE) = { alias_name: "hash" }];
}

message authsvr_router_cfg {
  uint64 node_id = 1;
  string node_name = 2;
  uint64 type_id = 3;
  string type_name = 4;

  authsvr_router_policy policy = 11;
  atframework.atapp.protocol.atapp_metadata policy_selector = 12;
}

message auth_channel_internal {
  // 内部鉴权配置
  bool enable = 1;
  bool allow_register = 2 [(atframework.atapp.protocol.CONFIGURE) = { default_value: "true" }];
}

message auth_channel_steam {
  // 内部鉴权配置
  bool enable = 1;
  bool enable_offline = 2 [(atframework.atapp.protocol.CONFIGURE) = { default_value: "true" }];
  uint32 app_id = 3;
  bytes rgub_key = 4;
  string rgub_key_hex = 5;

  // 离线验证token的默认值21天
  google.protobuf.Duration offline_token_timeout = 11
      [(atframework.atapp.protocol.CONFIGURE) = { default_value: "504h" min_value: "1s" }];

  // 定期在线验证
  google.protobuf.Duration online_checking_interval = 12
      [(atframework.atapp.protocol.CONFIGURE) = { default_value: "1h" min_value: "1s" }];
}

message authsvr_cfg {
  string version_conf = 1 [(atframework.atapp.protocol.CONFIGURE) = { default_value: "../cfg/cfg_version.xml" }];
  string strategy_conf = 2 [(atframework.atapp.protocol.CONFIGURE) = { default_value: "../cfg/cfg_strategy.xml" }];
  uint32 debug_platform = 3 [(atframework.atapp.protocol.CONFIGURE) = { default_value: "false" }];
  string cdn_url = 4;

  google.protobuf.Timestamp start_time = 11;
  google.protobuf.Timestamp end_time = 12;

  repeated string white_openid_list = 21;

  message backend_ingress_cfg {
    authsvr_router_cfg router = 1;
    google.protobuf.Duration relogin_expire = 2
        [(atframework.atapp.protocol.CONFIGURE) = { default_value: "14400s" min_value: "1" }];
  }
  backend_ingress_cfg backend = 31;

  auth_channel_internal internal_auth = 101;
  auth_channel_steam steam_auth = 102;
}
