syntax = "proto3";

package atorbit.protocol;

import "common.proto";

// ExternalService 由 service 侧 SDK 发送请求到 DSC。
// 请求发送方: Service SDK / External service side.
// 请求处理方: DSC service / Controller side.
service ExternalService {
  // Service SDK -> DSC: 首次建立会话连接。
  rpc ConnectExternal(ConnectExternalReq) returns (ConnectExternalRsp);
  // Service SDK -> DSC: 断线后按 last_received_seq 恢复会话。
  rpc ReconnectExternal(ReconnectExternalReq) returns (ReconnectExternalRsp);
  // Service SDK -> DSC: 发起启动 DS 的 RPC。
  rpc LaunchDedicatedServer(LaunchDedicatedServerReq) returns (LaunchDedicatedServerRsp);
  // Service SDK -> DSC: 向指定 DS 发送管理面消息。
  rpc SendToDS(SendToDSReq) returns (SendToDSRsp);
  // Service SDK -> DSC: 确认已消费 DS 的上行消息。
  rpc AckUpstream(ExternalAckUpstreamReq) returns (ExternalAckUpstreamRsp);
  // Service SDK -> DSC: 主动移除会话与路由绑定。
  rpc RemoveSession(RemoveSessionReq) returns (RemoveSessionRsp);
}

message ConnectExternalReq {
  RequestMeta meta = 1;
  SessionIdentity session = 2;
}

message ConnectExternalRsp {
  ErrorCode result_code = 1;
  string error_message = 2;
  SessionIdentity session = 3;
}

message ReconnectExternalReq {
  RequestMeta meta = 1;
  SessionIdentity session = 2;
}

message ReconnectExternalRsp {
  ErrorCode result_code = 1;
  string error_message = 2;
  repeated ForwardFromDSNotify replay_messages = 3;
}

message LaunchDedicatedServerReq {
  RequestMeta meta = 1;
  SessionIdentity session = 2;
  string target_region = 3;
  double expected_cpu = 4;
  double expected_memory_mb = 5;
  repeated string custom_args = 6;
}

message LaunchDedicatedServerRsp {
  ErrorCode result_code = 1;
  string error_message = 2;
  DSIdentity ds = 3;
}

message SendToDSReq {
  RequestMeta meta = 1;
  SessionIdentity session = 2;
  DSIdentity ds = 3;
  AckMeta ack = 4;
  bytes payload = 5;
  bool require_ack = 6;
}

message SendToDSRsp {
  ErrorCode result_code = 1;
  string error_message = 2;
}

message ExternalAckUpstreamReq {
  RequestMeta meta = 1;
  SessionIdentity session = 2;
  AckMeta ack = 3;
}

message ExternalAckUpstreamRsp {
  ErrorCode result_code = 1;
  string error_message = 2;
}

message RemoveSessionReq {
  RequestMeta meta = 1;
  SessionIdentity session = 2;
  string reason = 3;
}

message RemoveSessionRsp {
  ErrorCode result_code = 1;
  string error_message = 2;
}

message ForwardFromDSNotify {
  RequestMeta meta = 1;
  DSIdentity ds = 2;
  AckMeta ack = 3;
  bytes payload = 4;
}

message DownstreamAckNotify {
  RequestMeta meta = 1;
  DSIdentity ds = 2;
  AckMeta ack = 3;
}

message DSExitNotify {
  RequestMeta meta = 1;
  DSIdentity ds = 2;
  DSExitReason exit_reason = 3;
  int32 exit_code = 4;
  bytes user_data = 5;
}