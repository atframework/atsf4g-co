; atgateway benchmark configuration (echo server mode)
; usage: atgatewayd --conf=atgateway_benchmark.ini
; compression_algorithms / compression_level are set by the benchmark runner
; per combo (runner rewrites this file before launching the gateway).

[system]
log.level = 3
log.auto_update_time = true
log.print_file = false
log.print_function = false
log.print_type = true
log.print_time = "[%Y-%m-%d %H:%M:%S]"
log.std.level.min = 1
log.std.level.max = 3

[atgateway]
echo_server = true

[atgateway.listen]
type = atgateway_v2
address = ipv4://0.0.0.0:19005
backlog = 4096
max_client = 65536

[atgateway.client]
recv_buffer_size = 4MB
send_buffer_size = 8MB
first_idle_timeout = 60s
reconnect_timeout = 180s
shutdown_timeout = 5s

[atgateway.client.crypto]
update_interval = 300s
key_exchange = p-256
algorithms = aes-256-gcm
compression_algorithms = zstd
compression_level = kDefault
kdf_algorithms = hkdf-sha256
max_post_message_size = 8MB
